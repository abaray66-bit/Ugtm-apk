<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#B83268">
  <meta name="description" content="Application officielle de l'UGTM Souss-Massa - Signalements et services aux professionnels de santé.">
  <title>UGTM Souss-Massa — Santé</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary: #B83268;
      --primary-hover: #962654;
      --primary-light: #FDF2F5;
      --secondary: #D7A72C;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F172A;
        --surface: #1E293B;
        --text: #F8FAFC;
        --text-muted: #94A3B8;
        --border: #334155;
        --primary-light: #2A121D;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .app-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .h2 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      gap: 8px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn.block {
      width: 100%;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
    }

    .btn.primary:hover {
      background: var(--primary-hover);
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn.secondary {
      background: var(--secondary);
      color: white;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }

    .status.warning {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning);
    }

    .status.danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }

    .empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--text-muted);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 100;
    }

    .bottom-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      gap: 4px;
      cursor: pointer;
      width: 20%;
    }

    .bottom-btn.active {
      color: var(--primary);
    }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    [dir="rtl"] {
      text-align: right;
    }

    [dir="rtl"] .bottom-btn,
    [dir="rtl"] .nav-tabs {
      direction: rtl;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo-group">
      <div class="app-title-group">
        <h1 class="app-title" data-i18n="appTitle">
          UGTM Souss-Massa
        </h1>
        <p class="app-subtitle" data-i18n="appSubtitle">
          Fédération Régionale de la Santé
        </p>
      </div>
    </div>

    <button class="btn ghost" id="lang-toggle">
      عربي
    </button>
  </header>

  <nav class="nav-tabs">

    <button class="tab-btn active"
            data-tab="s-report"
            data-i18n="navReport">
      Signalement
    </button>

    <button class="tab-btn"
            data-tab="s-news"
            data-i18n="navNews">
      Actualités
    </button>

    <button class="tab-btn"
            data-tab="s-events"
            data-i18n="navEvents">
      Événements
    </button>

    <button class="tab-btn"
            data-tab="s-profile"
            data-i18n="navProfile">
      Mon Espace
    </button>

    <button class="tab-btn"
            id="admin-tab"
            data-tab="s-admin"
            data-i18n="navAdmin"
            hidden>
      Administration
    </button>

  </nav>

  <main class="container">

    <!-- SIGNALEMENT -->

    <section id="s-report" class="section active">

      <div class="card">

        <h2 class="h2" data-i18n="reportTitle">
          Nouveau Signalement
        </h2>

        <p style="color:var(--text-muted);font-size:.85rem;margin-bottom:16px"
           data-i18n="reportInfo">
          Votre signalement sera transmis de manière sécurisée.
        </p>

        <form id="report-form">

          <div class="form-group">

            <label class="form-label"
                   data-i18n="lblCategory">
              Catégorie
            </label>

            <select class="form-control"
                    name="category"
                    required>

              <option value="conditions"
                      data-i18n="catConditions">
                Conditions de travail
              </option>

              <option value="admin"
                      data-i18n="catAdmin">
                Administratif
              </option>

              <option value="affectation"
                      data-i18n="catAffectation">
                Affectation / Mutation
              </option>

              <option value="violence"
                      data-i18n="catViolence">
                Agression / Violence
              </option>

              <option value="other"
                      data-i18n="catOther">
                Autre
              </option>

            </select>

          </div>

          <div class="form-group">

            <label class="form-label"
                   data-i18n="lblMessage">
              Description du problème
            </label>

            <textarea
              class="form-control"
              name="message"
              required
              maxlength="4000"></textarea>

          </div>

          <button type="submit"
                  class="btn primary block"
                  id="report-submit"
                  data-i18n="btnSubmit">
            Envoyer le signalement
          </button>

        </form>

      </div>

      <div id="my-reports"></div>

    </section>


    <!-- ACTUALITES -->

    <section id="s-news" class="section">

      <div id="news-list">
        <div class="empty"
             data-i18n="noNews">
          Aucune actualité disponible.
        </div>
      </div>

    </section>


    <!-- EVENEMENTS -->

    <section id="s-events" class="section">

      <div id="events-list">
        <div class="empty"
             data-i18n="noEvents">
          Aucun événement disponible.
        </div>
      </div>

    </section>


    <!-- PROFIL -->

    <section id="s-profile" class="section">

      <div id="profile-box"></div>

    </section>


    <!-- ADMIN -->

    <section id="s-admin" class="section">

      <div id="admin-box">

        <div class="card">

          <h2 class="h2"
              data-i18n="adminTitle">
            Administration
          </h2>

          <p data-i18n="adminRequired">
            Accès réservé aux administrateurs.
          </p>

        </div>

      </div>

    </section>

  </main>


  <div id="toast" class="toast"></div>


  <!-- NAVIGATION BAS -->

  <nav class="bottom-nav">

    <button class="bottom-btn active"
            data-tab="s-report">

      <span data-i18n="navReport">
        Signalement
      </span>

    </button>

    <button class="bottom-btn"
            data-tab="s-news">

      <span data-i18n="navNews">
        Actualités
      </span>

    </button>

    <button class="bottom-btn"
            data-tab="s-events">

      <span data-i18n="navEvents">
        Événements
      </span>

    </button>

    <button class="bottom-btn"
            data-tab="s-profile">

      <span data-i18n="navProfile">
        Mon Espace
      </span>

    </button>

  </nav>


  <!-- IMPORTANT : data.js AVANT app.js -->

  <script src="data.js"></script>


  <script>

    /*
     * ============================================================
     * DONNEES
     * ============================================================
     */

    var DATA = window.APP_DATA || {};

    var S = {
      lang: 'fr',
      user: null,
      member: null,
      isAdmin: false,
      cloud: DATA.firebase ? 'loading' : 'off',
      news: [],
      events: [],
      members: [],
      reports: []
    };


    /*
     * ============================================================
     * TRADUCTIONS
     * ============================================================
     */

    var T = function(key) {

      var dict = {

        fr: {

          appTitle: "UGTM Souss-Massa",

          appSubtitle:
            "Fédération Régionale de la Santé",

          navReport:
            "Signalement",

          navNews:
            "Actualités",

          navEvents:
            "Événements",

          navProfile:
            "Mon Espace",

          navAdmin:
            "Administration",

          reportTitle:
            "Nouveau Signalement",

          reportInfo:
            "Votre signalement sera transmis de manière sécurisée.",

          lblCategory:
            "Catégorie",

          catConditions:
            "Conditions de travail",

          catAdmin:
            "Administratif",

          catAffectation:
            "Affectation / Mutation",

          catViolence:
            "Agression / Violence",

          catOther:
            "Autre",

          lblMessage:
            "Description du problème",

          btnSubmit:
            "Envoyer le signalement",

          profileTitle:
            "Mon Espace",

          loginRequired:
            "Vous devez être connecté pour accéder à votre espace.",

          signin:
            "Se connecter avec Google",

          signout:
            "Se déconnecter",

          connected:
            "Connecté",

          notConnected:
            "Non connecté",

          loginFirst:
            "Veuillez vous connecter avant d'envoyer un signalement.",

          sending:
            "Envoi en cours...",

          sent:
            "Signalement envoyé avec succès.",

          sendError:
            "Impossible d'envoyer le signalement.",

          connectionError:
            "Le service de connexion n'est pas disponible.",

          connectionFailed:
            "Connexion impossible.",

          logoutFailed:
            "Déconnexion impossible.",

          noNews:
            "Aucune actualité disponible.",

          noEvents:
            "Aucun événement disponible.",

          noReports:
            "Aucun signalement personnel.",

          adminTitle:
            "Administration",

          adminRequired:
            "Accès réservé aux administrateurs."

        },

        ar: {

          appTitle:
            "الاتحاد العام للشغالين بالمغرب",

          appSubtitle:
            "الجامعة الوطنية للصحة - سوس ماسة",

          navReport:
            "تبليغ",

          navNews:
            "أخبار",

          navEvents:
            "أنشطة",

          navProfile:
            "حسابي",

          navAdmin:
            "الإدارة",

          reportTitle:
            "تبليغ جديد",

          reportInfo:
            "سيتم إرسال تبليغكم بطريقة آمنة.",

          lblCategory:
            "الصنف",

          catConditions:
            "ظروف العمل",

          catAdmin:
            "إداري",

          catAffectation:
            "تعيين / انتقال",

          catViolence:
            "اعتداء / عنف",

          catOther:
            "آخر",

          lblMessage:
            "وصف المشكل",

          btnSubmit:
            "إرسال التبليغ",

          profileTitle:
            "حسابي",

          loginRequired:
            "يجب تسجيل الدخول للوصول إلى حسابك.",

          signin:
            "تسجيل الدخول بواسطة Google",

          signout:
            "تسجيل الخروج",

          connected:
            "متصل",

          notConnected:
            "غير متصل",

          loginFirst:
            "يرجى تسجيل الدخول قبل إرسال التبليغ.",

          sending:
            "جاري الإرسال...",

          sent:
            "تم إرسال التبليغ بنجاح.",

          sendError:
            "تعذر إرسال التبليغ.",

          connectionError:
            "خدمة تسجيل الدخول غير متاحة.",

          connectionFailed:
            "تعذر تسجيل الدخول.",

          logoutFailed:
            "تعذر تسجيل الخروج.",

          noNews:
            "لا توجد أخبار حاليا.",

          noEvents:
            "لا توجد أنشطة حاليا.",

          noReports:
            "لا توجد تبليغات شخصية.",

          adminTitle:
            "الإدارة",

          adminRequired:
            "الوصول مخصص للمسؤولين."

        }

      };

      return (
        dict[S.lang] &&
        dict[S.lang][key]
      )
        ? dict[S.lang][key]
        : key;

    };


    /*
     * ============================================================
     * SECURITE HTML
     * ============================================================
     */

    function esc(str) {

      if (!str) {
        return '';
      }

      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    /*
     * ============================================================
     * TOAST
     * ============================================================
     */

    function toast(msg) {

      var t =
        document.getElementById('toast');

      if (!t) {
        return;
      }

      t.textContent = msg;

      t.classList.add('show');

      setTimeout(function() {

        t.classList.remove('show');

      }, 3000);

    }


    /*
     * ============================================================
     * CLOUD
     * ============================================================
     */

    var CLOUD =
      window.CLOUD || null;

    var CLOUD_ON =
      !!DATA.firebase;


    /*
     * ============================================================
     * SESSION FIREBASE
     * ============================================================
     */

    window.UGTM =
      window.UGTM || {};


    window.UGTM.ready =
      function() {

        CLOUD =
          window.CLOUD || null;

        S.cloud =
          'ready';

        renderProfile();

        renderReports();

      };


    window.UGTM.failed =
      function() {

        S.cloud =
          'error';

        renderProfile();

        renderReports();

      };


    window.UGTM.error =
      function(error) {

        console.error(
          'UGTM Cloud:',
          error
        );

      };


    /*
     * IMPORTANT :
     * cloud.js envoie un objet session :
     *
     * {
     *   user,
     *   member,
     *   isAdmin
     * }
     */

    window.UGTM.setSession =
      function(session) {

        session =
          session || {};

        S.user =
          session.user || null;

        S.member =
          session.member || null;

        S.isAdmin =
          !!session.isAdmin;

        var adminTab =
          document.getElementById('admin-tab');

        if (adminTab) {

          adminTab.hidden =
            !S.isAdmin;

        }

        renderProfile();

        renderReports();

      };


    window.UGTM.setNews =
      function(news) {

        S.news =
          news || [];

        renderNews();

      };


    window.UGTM.setEvents =
      function(events) {

        S.events =
          events || [];

        renderEvents();

      };


    window.UGTM.setMembers =
      function(members) {

        S.members =
          members || [];

      };


    window.UGTM.setReports =
      function(reports) {

        S.reports =
          reports || [];

        renderReports();

      };


    /*
     * ============================================================
     * PROFIL
     * ============================================================
     */

    function renderProfile() {

      var box =
        document.getElementById(
          'profile-box'
        );

      if (!box) {
        return;
      }


      if (!S.user) {

        box.innerHTML =

          '<div class="card">' +

            '<h2 class="h2">' +

              esc(
                T('profileTitle')
              ) +

            '</h2>' +

            '<p>' +

              esc(
                T('loginRequired')
              ) +

            '</p>' +

            '<button ' +

              'type="button" ' +

              'class="btn primary block" ' +

              'data-action="signin" ' +

              'style="margin-top:12px">' +

              esc(
                T('signin')
              ) +

            '</button>' +

          '</div>';

        return;

      }


      var name =
        S.user.displayName ||
        S.user.email ||
        'Utilisateur';


      var memberInfo = '';


      if (S.member) {

        if (S.member.name) {

          memberInfo +=
            '<p style="margin-top:8px">' +
              '<strong>Nom :</strong> ' +
              esc(S.member.name) +
            '</p>';

        }

        if (S.member.etab) {

          memberInfo +=
            '<p>' +
              '<strong>Établissement :</strong> ' +
              esc(S.member.etab) +
            '</p>';

        }

      }


      box.innerHTML =

        '<div class="card">' +

          '<h2 class="h2">' +

            esc(
              T('profileTitle')
            ) +

          '</h2>' +

          '<span class="status success">' +

            esc(
              T('connected')
            ) +

          '</span>' +

          '<p style="margin-top:12px">' +

            'Bonjour, <strong>' +

              esc(name) +

            '</strong>' +

          '</p>' +

          '<p style="color:var(--text-muted)">' +

            esc(
              S.user.email || ''
            ) +

          '</p>' +

          memberInfo +

          '<button ' +

            'type="button" ' +

            'class="btn ghost block" ' +

            'data-action="signout" ' +

            'style="margin-top:16px">' +

            esc(
              T('signout')
            ) +

          '</button>' +

        '</div>';

    }


    /*
     * ============================================================
     * SIGNALEMENTS
     * ============================================================
     */

    function renderReports() {

      var box =
        document.getElementById(
          'my-reports'
        );

      if (!box) {
        return;
      }


      if (!S.user) {

        box.innerHTML = '';

        return;

      }


      var mine =
        (S.reports || []).filter(
          function(report) {

            return (
              report &&
              report.ownerUid ===
              S.user.uid
            );

          }
        );


      if (!mine.length) {

        box.innerHTML =

          '<div class="card">' +

            '<h2 class="h2">' +

              'Mes signalements' +

            '</h2>' +

            '<div class="empty">' +

              esc(
                T('noReports')
              ) +

            '</div>' +

          '</div>';

        return;

      }


      var html =

        '<div class="card">' +

          '<h2 class="h2">' +

            'Mes signalements' +

          '</h2>';


      mine.forEach(
        function(report) {

          html +=

            '<div style="' +

              'border-top:1px solid var(--border);' +

              'padding:12px 0">' +

              '<strong>' +

                esc(
                  report.category
                ) +

              '</strong>' +

              '<p style="' +

                'margin-top:6px;' +

                'white-space:pre-wrap">' +

                esc(
                  report.description ||
                  report.message ||
                  ''
                ) +

              '</p>' +

              '<small style="' +

                'color:var(--text-muted)">' +

                esc(
                  report.status || 'new'
                ) +

              '</small>' +

            '</div>';

        }
      );


      html +=
        '</div>';


      box.innerHTML =
        html;

    }


    /*
     * ============================================================
     * ACTUALITES
     * ============================================================
     */

    function renderNews() {

      var box =
        document.getElementById(
          'news-list'
        );

      if (!box) {
        return;
      }


      if (!S.news.length) {

        box.innerHTML =

          '<div class="card empty">' +

            esc(
              T('noNews')
            ) +

          '</div>';

        return;

      }


      var html = '';


      S.news.forEach(
        function(item) {

          html +=

            '<div class="card">' +

              '<h2 class="h2">' +

                esc(
                  item.title ||
                  ''
                ) +

              '</h2>' +

              '<p style="white-space:pre-wrap">' +

                esc(
                  item.content ||
                  item.description ||
                  ''
                ) +

              '</p>' +

            '</div>';

        }
      );


      box.innerHTML =
        html;

    }


    /*
     * ============================================================
     * EVENEMENTS
     * ============================================================
     */

    function renderEvents() {

      var box =
        document.getElementById(
          'events-list'
        );

      if (!box) {
        return;
      }


      if (!S.events.length) {

        box.innerHTML =

          '<div class="card empty">' +

            esc(
              T('noEvents')
            ) +

          '</div>';

        return;

      }


      var html = '';


      S.events.forEach(
        function(item) {

          html +=

            '<div class="card">' +

              '<h2 class="h2">' +

                esc(
                  item.title ||
                  ''
                ) +

              '</h2>' +

              '<p>' +

                esc(
                  item.description ||
                  item.content ||
                  ''
                ) +

              '</p>' +

            '</div>';

        }
      );


      box.innerHTML =
        html;

    }


    /*
     * ============================================================
     * SETUP CLOUD
     * ============================================================
     */

    function setupCloud() {

      CLOUD =
        window.CLOUD || null;


      if (!CLOUD) {

        S.cloud =
          'error';

        renderProfile();

        renderReports();

        return;

      }


      S.cloud =
        'ready';

      renderProfile();

      renderReports();

    }


    /*
     * ============================================================
     * ENVOI SIGNALEMENT
     * ============================================================
     */

    async function submitReport(form) {

      if (!CLOUD ||
          !CLOUD.addReport) {

        toast(
          T('sendError')
        );

        return;

      }


      if (!S.user) {

        toast(
          T('loginFirst')
        );

        return;

      }


      var submit =
        document.getElementById(
          'report-submit'
        );


      if (submit) {

        submit.disabled =
          true;

        submit.textContent =
          T('sending');

      }


      var fd =
        new FormData(form);


      var category =
        String(
          fd.get('category') ||
          ''
        ).trim();


      var message =
        String(
          fd.get('message') ||
          ''
        ).trim();


      if (!message) {

        if (submit) {

          submit.disabled =
            false;

          submit.textContent =
            T('btnSubmit');

        }

        return;

      }


      var payload = {

        ownerUid:
          S.user.uid || '',

        anonymous:
          false,

        name:
          S.user.displayName ||
          S.user.email ||
          '',

        etab:
          S.member &&
          S.member.etab
            ? S.member.etab
            : '',

        category:
          category,

        description:
          message,

        date:
          new Date()
            .toISOString()
            .slice(0, 10),

        location:
          '',

        attachmentName:
          '',

        attachmentType:
          '',

        attachmentData:
          '',

        status:
          'new',

        response:
          ''

      };


      try {

        await CLOUD.addReport(
          payload
        );


        form.reset();


        toast(
          T('sent')
        );


      }
      catch (error) {

        console.error(
          'Signalement:',
          error
        );

        toast(
          T('sendError')
        );

      }
      finally {

        if (submit) {

          submit.disabled =
            false;

          submit.textContent =
            T('btnSubmit');

        }

      }

    }


    /*
     * ============================================================
     * CONNEXION / DECONNEXION
     * ============================================================
     */

    function signIn() {

      CLOUD =
        window.CLOUD || null;


      if (!CLOUD ||
          !CLOUD.signIn) {

        toast(
          T('connectionError')
        );

        return;

      }


      CLOUD.signIn()
        .catch(
          function(error) {

            console.error(
              'Connexion:',
              error
            );

            toast(
              T('connectionFailed')
            );

          }
        );

    }


    function signOut() {

      CLOUD =
        window.CLOUD || null;


      if (!CLOUD ||
          !CLOUD.signOut) {

        return;

      }


      CLOUD.signOut()
        .catch(
          function(error) {

            console.error(
              'Déconnexion:',
              error
            );

            toast(
              T('logoutFailed')
            );

          }
        );

    }


    /*
     * ============================================================
     * NAVIGATION
     * ============================================================
     */

    function showTab(targetId) {

      document
        .querySelectorAll(
          '.tab-btn, .bottom-btn'
        )
        .forEach(
          function(button) {

            button.classList.toggle(
              'active',
              button.getAttribute(
                'data-tab'
              ) === targetId
            );

          }
        );


      document
        .querySelectorAll(
          '.section'
        )
        .forEach(
          function(section) {

            section.classList.toggle(
              'active',
              section.id === targetId
            );

          }
        );

    }


    /*
     * ============================================================
     * CHANGEMENT LANGUE
     * ============================================================
     */

    function applyLanguage() {

      document.documentElement
        .lang =
          S.lang;

      document.documentElement
        .dir =
          S.lang === 'ar'
            ? 'rtl'
            : 'ltr';


      document
        .querySelectorAll(
          '[data-i18n]'
        )
        .forEach(
          function(element) {

            var key =
              element.getAttribute(
                'data-i18n'
              );

            element.textContent =
              T(key);

          }
        );


      var langButton =
        document.getElementById(
          'lang-toggle'
        );


      if (langButton) {

        langButton.textContent =
          S.lang === 'fr'
            ? 'عربي'
            : 'Français';

      }


      renderProfile();

      renderReports();

      renderNews();

      renderEvents();

    }


    /*
     * ============================================================
     * EVENEMENTS
     * ============================================================
     */

    document.addEventListener(
      'click',
      function(e) {

        var actionElement =
          e.target.closest(
            '[data-action]'
          );


        if (actionElement) {

          var action =
            actionElement.getAttribute(
              'data-action'
            );


          if (action === 'signin') {

            signIn();

            return;

          }


          if (action === 'signout') {

            signOut();

            return;

          }

        }


        var tabButton =
          e.target.closest(
            '[data-tab]'
          );


        if (tabButton) {

          var targetId =
            tabButton.getAttribute(
              'data-tab'
            );


          if (
            targetId === 's-admin' &&
            !S.isAdmin
          ) {

            toast(
              T('adminRequired')
            );

            return;

          }


          showTab(
            targetId
          );

        }

      }
    );


    /*
     * ============================================================
     * FORMULAIRE SIGNALEMENT
     * ============================================================
     */

    document.addEventListener(
      'submit',
      function(e) {

        if (
          e.target &&
          e.target.id ===
          'report-form'
        ) {

          e.preventDefault();

          submitReport(
            e.target
          );

        }

      }
    );


    /*
     * ============================================================
     * LANGUE
     * ============================================================
     */

    document
      .getElementById(
        'lang-toggle'
      )
      .addEventListener(
        'click',
        function() {

          S.lang =
            S.lang === 'fr'
              ? 'ar'
              : 'fr';

          applyLanguage();

        }
      );


    /*
     * ============================================================
     * INITIALISATION FIREBASE
     * ============================================================
     */

    function init() {

      renderProfile();

      renderNews();

      renderEvents();

      renderReports();


      if (!DATA.firebase) {

        S.cloud =
          'off';

        return;

      }


      import('./cloud.js')

        .then(
          function(mod) {

            return mod.init(
              DATA.firebase,
              window.UGTM
            );

          }
        )

        .then(
          function() {

            setupCloud();

          }
        )

        .catch(
          function(error) {

            console.error(
              'Initialisation Cloud impossible:',
              error
            );

            window.UGTM.failed();

          }
        );

    }


    /*
     * ============================================================
     * DOM READY
     * ============================================================
     */

    document.addEventListener(
      'DOMContentLoaded',
      function() {

        applyLanguage();

        init();

      }
    );

  </script>

</body>
</html>
