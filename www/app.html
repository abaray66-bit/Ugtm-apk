<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UGTM Souss-Massa</title>
<meta name="description" content="Application de la Fédération régionale UGTM Souss-Massa : communiqués, agenda, signalements et contacts.">
<meta name="theme-color" content="#B83268">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UGTM SM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7FA;
  --surface:#FFFFFF;
  --ink:#24191F;
  --muted:#75656C;
  --line:#EAD9E0;
  --primary:#B83268;
  --on-primary:#FFFFFF;
  --link:#B83268;
  --accent:#D7A72C;
  --on-accent:#241C08;
  --alert:#B51F2A;
  --soft:#FCECF3;
  --focus:#C94B7D;
  --ok:#B83268;
  --font-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-head:"Cairo","IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A0D13; --surface:#24121A; --ink:#FFF0F5; --muted:#C7AEB8;
    --line:#432532; --primary:#A92F60; --on-primary:#FFFFFF; --link:#F08BB2;
    --accent:#E2B33B; --on-accent:#211804; --alert:#FF777D; --soft:#351B27;
    --focus:#F08BB2; --ok:#F08BB2;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0D13; --surface:#24121A; --ink:#FFF0F5; --muted:#C7AEB8;
  --line:#432532; --primary:#A92F60; --on-primary:#FFFFFF; --link:#F08BB2;
  --accent:#E2B33B; --on-accent:#211804; --alert:#FF777D; --soft:#351B27;
  --focus:#F08BB2; --ok:#F08BB2;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--surface);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
[dir="rtl"] body{line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}

.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.mark{width:40px;height:40px;border-radius:11px;background:var(--primary);display:grid;place-items:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--font-head);font-weight:800;font-size:15px;line-height:1.3}
.brand span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.langbtn{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer}
.notice{background:var(--soft);color:var(--muted);font-size:12.5px;text-align:center;padding:5px 16px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 28px}
.title{font-family:var(--font-head);font-weight:800;font-size:24px;line-height:1.3;margin:4px 0 12px}
.lead{margin:0 0 18px;color:var(--muted)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 8px}
.sechead h2{font-family:var(--font-head);font-weight:600;font-size:18px;margin:0}
.link{background:none;border:0;padding:6px 0;color:var(--link);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.hero{background:var(--primary);color:var(--on-primary);border-radius:20px;padding:22px 20px 20px;border-inline-start:6px solid var(--accent)}
.hero h1{font-family:var(--font-head);font-weight:800;font-size:24px;line-height:1.3;margin:0 0 8px}
.hero p{margin:0 0 18px;color:rgba(255,255,255,.88)}

.btn{min-height:46px;padding:0 20px;border-radius:12px;border:0;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--accent);color:var(--on-accent)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{border-bottom:1px solid var(--line)}
.item.urgent{border-inline-start:3px solid var(--alert);padding-inline-start:12px}
.head{width:100%;background:none;border:0;padding:14px 0;display:flex;align-items:center;gap:12px;text-align:start;cursor:pointer}
.ht{flex:1;min-width:0;display:block}
.meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:2px}
.tt{display:block;font-weight:600;font-size:16px;line-height:1.45}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--soft);color:var(--ink)}
.tag.urgent{background:transparent;color:var(--alert);border:1px solid var(--alert)}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.panel{padding:0 0 16px}
.panel p{margin:0 0 12px;color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.fbtn{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.ev{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.events{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.date{flex:none;width:56px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0 5px}
.date b{display:block;font-family:var(--font-head);font-weight:800;font-size:22px;line-height:1.1}
.date span{display:block;font-size:12px;color:var(--muted)}
.evb{flex:1;min-width:0}
.evb strong{display:block;font-size:16px;line-height:1.45}
.evb p{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.nextcard{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nextcard .ev{border-bottom:0}

.field{margin:0 0 18px;padding:0;border:0;min-width:0}
.field label,.field legend{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px;padding:0}
.field input[type="text"],
.field input[type="tel"],
.field input[type="date"],
.field input[type="time"],
.field input[type="file"],
.field select,
.field textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.field textarea{resize:vertical;min-height:120px}
.field .req{color:var(--alert);margin-inline-start:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.chip input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.err{color:var(--alert);font-size:14px;margin:6px 0 0;font-weight:500}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px;margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.switchrow b{display:block;font-size:15px}
.switchrow p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.sw{position:relative;flex:none;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{inset-inline-start:25px}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.done{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:16px;padding:20px}
.done h1{font-family:var(--font-head);font-weight:800;font-size:22px;margin:0 0 8px}
.done p{margin:0 0 10px}
.ref{font-family:var(--font-head);font-weight:800;font-size:22px;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate;display:inline-block}

.attname{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.attname b{color:var(--ink);font-weight:600}

.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rows{border-top:1px solid var(--line)}
.ico{flex:none;width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--link);display:grid;place-items:center}
.rb{flex:1;min-width:0}
.rb strong{display:block;font-size:16px}
.rb p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.install{margin-top:24px;padding:16px;border-radius:14px;background:var(--soft)}
.install h2{font-family:var(--font-head);font-weight:600;font-size:17px;margin:0 0 6px}
.install p{margin:0;font-size:14.5px}
.install .ios{margin-top:8px}
.install .btn{margin-top:14px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 6px;position:relative;z-index:2}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:54px;padding:4px 2px;font-size:12px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{color:var(--link);font-weight:600}
.tab .bubble{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-22px;box-shadow:0 0 0 5px var(--surface)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.points{margin:0 0 4px;padding-inline-start:20px}
.points li{margin-bottom:8px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.empty{padding:16px 0;color:var(--muted);list-style:none;margin:0}
.acctbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;color:var(--ink)}
.acctbtn img{width:100%;height:100%;object-fit:cover}
.h2{font-family:var(--font-head);font-weight:600;font-size:18px;margin:8px 0 12px}
.danger{color:var(--alert)}
.link.danger{margin-top:4px}
.statusline{padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:500;margin:0 0 16px;border-inline-start:4px solid var(--accent)}
.statusline.active{border-inline-start-color:var(--ok)}
.statusline.blocked{border-inline-start-color:var(--alert)}

.mcard{background:var(--primary);color:#fff;border-radius:18px;padding:18px 18px 16px;border-inline-start:6px solid var(--accent);margin:0 0 22px}
.mtop{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:600;font-size:14px}
.mmark{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.mname{font-family:var(--font-head);font-weight:800;font-size:22px;line-height:1.3;margin:16px 0 2px}
.msub{color:rgba(255,255,255,.84);font-size:14.5px}
.mfoot{display:flex;gap:28px;margin-top:18px}
.mfoot span{display:block;font-size:12.5px;color:rgba(255,255,255,.74)}
.mfoot b{font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:.03em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.tag.lock{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.st-active{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.tag.st-blocked{background:transparent;border:1px solid var(--alert);color:var(--alert)}
.mrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);list-style:none}
.mi{flex:1;min-width:0}
.mi strong{display:block;font-size:16px;line-height:1.45}
.mi span{display:block;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.mi strong .tag{display:inline-block;vertical-align:middle;margin-inline-start:6px}
.mact{display:flex;flex-direction:column;gap:6px;flex:none}
.adm{direction:ltr}
.adm *{direction:ltr}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 5v9a6 6 0 0 0 12 0V5"/>
      </svg>
    </div>
    <div class="brand">
      <b data-i18n="brandName"></b>
      <span data-i18n="brandSub"></span>
    </div>
    <button class="acctbtn" id="meBtn" type="button" hidden data-go="me"></button>
    <button class="langbtn" id="langBtn" type="button"></button>
  </header>

  <main id="main">

    <!-- ============ ACCUEIL ============ -->
    <section class="screen" id="s-home">
      <div class="hero">
        <h1 data-i18n="heroT"></h1>
        <p data-i18n="heroP"></p>
        <button class="btn gold" type="button" data-form="1" data-i18n="heroBtn"></button>
      </div>

      <div class="sechead">
        <h2 data-i18n="nextT"></h2>
        <button class="link" type="button" data-go="agenda" data-i18n="seeAgenda"></button>
      </div>
      <div class="nextcard" id="nextEvent"></div>

      <div class="sechead">
        <h2 data-i18n="recentT"></h2>
        <button class="link" type="button" data-go="news" data-i18n="seeAll"></button>
      </div>
      <ul class="list" id="recentList"></ul>
    </section>

    <!-- ============ COMMUNIQUÉS ============ -->
    <section class="screen" id="s-news" hidden>
      <h1 class="title" data-i18n="newsT"></h1>
      <div class="filters" id="filters" role="group"></div>
      <ul class="list" id="newsList"></ul>
    </section>

    <!-- ============ SIGNALEMENT (FORMULAIRE INTÉGRÉ) ============ -->
    <section class="screen" id="s-report" hidden>
      <h1 class="title" data-i18n="reportT"></h1>
      <p class="lead" data-i18n="reportP"></p>

      <!-- Message d'info si non connecté -->
      <div id="reportAuthMsg" hidden>
        <div class="statusline" id="reportAuthStatus"></div>
        <button class="btn primary block" type="button" data-act="signin" data-i18n="meBtnIn"></button>
        <p class="hint" style="margin-top:16px" data-i18n="rfAuthNote"></p>
      </div>

      <!-- Le formulaire -->
      <form id="reportForm" novalidate hidden>

        <fieldset class="field">
          <legend data-i18n="rfCat"></legend>
          <div class="chips" id="rfCatChips"></div>
        </fieldset>

        <div class="field">
          <label for="rfEtab" data-i18n="rfEtab"></label>
          <input id="rfEtab" type="text" autocomplete="off" maxlength="120">
        </div>

        <div class="field">
          <label for="rfProv" data-i18n="rfProv"></label>
          <select id="rfProv"></select>
        </div>

        <div class="field">
          <label for="rfLocation" data-i18n="rfLocation"></label>
          <input id="rfLocation" type="text" autocomplete="off" maxlength="120">
        </div>

        <div class="field">
          <label for="rfDate" data-i18n="rfDate"></label>
          <input id="rfDate" type="date">
        </div>

        <div class="field">
          <label for="rfMsg">
            <span data-i18n="rfMsg"></span><span class="req" aria-hidden="true">*</span>
          </label>
          <textarea id="rfMsg" rows="6" required maxlength="4000"></textarea>
          <p class="hint" id="rfMsgCount">0 / 4000</p>
        </div>

        <div class="field">
          <label for="rfFile" data-i18n="rfFile"></label>
          <input id="rfFile" type="file" accept="image/*,application/pdf">
          <p class="hint" data-i18n="rfFileHint"></p>
          <p class="attname" id="rfFileName" hidden></p>
        </div>

        <div class="switchrow">
          <div>
            <b data-i18n="rfAnonT"></b>
            <p data-i18n="rfAnonP"></p>
          </div>
          <button type="button" class="sw" id="rfAnon" role="switch" aria-checked="false" aria-label="Anonyme"></button>
        </div>

        <p class="hint" data-i18n="rfAuthNote"></p>

        <button type="submit" class="btn primary block" id="rfSubmit" data-i18n="rfSend"></button>
      </form>

      <!-- Confirmation -->
      <div id="reportDone" hidden class="done">
        <h1 data-i18n="rfDoneT"></h1>
        <p data-i18n="rfDoneP"></p>
        <p><span class="ref" id="reportRef">—</span></p>
        <button class="btn primary block" type="button" data-go="home" data-i18n="rfDoneB"></button>
      </div>
    </section>

    <!-- ============ AGENDA ============ -->
    <section class="screen" id="s-agenda" hidden>
      <h1 class="title" data-i18n="agendaT"></h1>
      <ul class="events" id="eventList"></ul>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="screen" id="s-contact" hidden>
      <h1 class="title" data-i18n="contactT"></h1>
      <div class="rows">
        <div class="row">
          <div class="ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5h16v11H9l-5 4z"/>
            </svg>
          </div>
          <div class="rb">
            <strong data-i18n="cWa"></strong>
            <p data-i18n="cWaD"></p>
          </div>
          <button class="btn ghost small" type="button" data-link="wa" data-i18n="cWaB"></button>
        </div>
        <div class="row">
          <div class="ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>
            </svg>
          </div>
          <div class="rb">
            <strong data-i18n="cTg"></strong>
            <p data-i18n="cTgD"></p>
          </div>
          <button class="btn ghost small" type="button" data-link="tg" data-i18n="cTgB"></button>
        </div>
        <div class="row">
          <div class="ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
            </svg>
          </div>
          <div class="rb">
            <strong data-i18n="cNum"></strong>
            <p data-i18n="cNumD"></p>
          </div>
          <button class="btn ghost small" type="button" data-link="num" data-i18n="cNumB"></button>
        </div>
        <div class="row">
          <div class="ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/>
              <circle cx="12" cy="10" r="2.5"/>
            </svg>
          </div>
          <div class="rb">
            <strong data-i18n="cPerm"></strong>
            <p id="permDesc"></p>
          </div>
        </div>
      </div>

      <div class="install" id="installCard">
        <h2 data-i18n="installT"></h2>
        <p data-i18n="installP"></p>
        <p class="ios" data-i18n="installIos"></p>
        <button class="btn primary" type="button" id="installBtn" hidden data-i18n="installBtn"></button>
      </div>
    </section>

    <!-- ============ MON ESPACE ============ -->

    <!-- ============ ADMINISTRATION ============ -->
    <section class="screen adm" id="s-admin" hidden dir="ltr" lang="fr">
      <button class="link" type="button" data-go="me">‹ Retour à mon espace</button>

      <div class="filters" id="admTabs" role="group">

      <div id="adm-members">

      <div id="adm-news" hidden>
        <h2 class="h2">Nouveau communiqué</h2>
        <div class="field">

            <option value="statut" selected>Statuts</option>

        </div>
        <div class="field">
          <label for="nAud">Qui peut le lire ?</label>

            <option value="public">Tout le monde</option>

        <div class="field">

        <div class="field">
          <label for="nTAr">العنوان (بالعربية)</label>

        <div class="field">
          <label for="nBAr">النص (بالعربية)</label>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
/*
==========================================================
UGTM SOUSS-MASSA — App (avec signalement intégré)
==========================================================
*/
(function(){

var D = window.APP_DATA || {};
var LINKS = D.links || {};
var CONTACT = D.contact || [];
var NEWS = D.news || [];
var EVENTS = D.events || [];
var PERM = D.permanence || {};
var CLOUD_ON = !!(D.firebase && D.firebase.apiKey);

var STATUS_FR={
  pending:`En attente`,
  active:`Actif`,
  blocked:`Suspendu`
};

var S = {
  cloud: CLOUD_ON ? 'loading' : 'off',
  user: null,
  member: null,
  isAdmin: false,
  members: [],
  memFilter: 'pending',
  admTab: 'members',
  formDirty: false,
  rfDirty: false,
  rfFile: null
};

var lang='fr';
var filter='all';
var openId=null;
var toastTimer=null;
var deferredInstall=null;

try{
  var saved=localStorage.getItem('ugtm-lang');
  if(saved==='fr'||saved==='ar'){
    lang=saved;
  }else if((navigator.language||'').toLowerCase().indexOf('ar')===0){
    lang='ar';
  }
}catch(e){}

function $(id){return document.getElementById(id);}
function T(){return I18N[lang];}

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function L(o){return (o&&(o[lang]||o.fr||o.ar))||{};}
function titleFr(o){return (o.fr&&o.fr.t)||(o.ar&&o.ar.t)||'';}

function paras(s){
  return String(s||'')
    .split(/\n{2,}/)
    .map(function(p){
      return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';
    })
    .join('');
}

function pad(n){return (n<10?'0':'')+n;}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function fmtDate(str,withDay){
  var p=String(str).split('-');
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var s=d.getDate()+' '+MONTHS[lang][d.getMonth()];
  return withDay ? DAYS[lang][d.getDay()]+' '+s : s;
}

function fmtTime(t){return lang==='fr'?String(t).replace(':','h'):t;}
function provName(v,l){
  var f=PROVS.filter(function(p){return p.v===v;})[0];
  return f?f[l||lang]:(v||'');
}

function sortedNews(){
  return NEWS.slice().sort(function(a,b){
    return a.date<b.date?1:(a.date>b.date?-1:0);
  });
}

function upcoming(){
  var t=todayStr();
  return EVENTS
    .filter(function(e){return e.date>=t;})
    .sort(function(a,b){
      var x=a.date+(a.time||'');
      var y=b.date+(b.time||'');
      return x<y?-1:(x>y?1:0);
    });
}

function toast(msg,ms){
  var el=$('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},ms||2400);
}

function showError(err,quiet){
  try{console.error(err);}catch(e){}
  if(quiet)return;
  var code=(err&&(err.code||err.message))||'';
  toast(T().errPrefix+(code?' ('+code+')':''),6000);
}

function openUrl(url){
  if(!url){toast(T().toastLink);return;}
  window.open(url,'_blank','noopener');
}

function linkFor(key){
  if(key==='wa') return (CONTACT[0]&&CONTACT[0].url)||'';
  if(key==='tg') return (CONTACT[2]&&CONTACT[2].url)||'';
  if(key==='num') return (CONTACT[1]&&CONTACT[1].url)||
    ((PERM.phone||'').replace(/\D/g,'')
      ?'https://wa.me/'+String(PERM.phone).replace(/\D/g,'')
      :'');
  return '';
}

function download(name,type,text){
  var blob=new Blob([text],{type:type});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}

function cloud(){
  if(!window.CLOUD){toast(T().meOffline,4000);return null;}
  return window.CLOUD;
}

var CHEV=
  '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M6 9l6 6 6-6"/></svg>';

var PERSON=
  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<circle cx="12" cy="8" r="4"/>'+
  '<path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';

var MARK=
  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7A72C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M6 5v9a6 6 0 0 0 12 0V5"/></svg>';

function tagHTML(c){
  var k=CATS[c.cat]?c.cat:'statut';
  return '<span class="tag '+k+'">'+CATS[k][lang]+'</span>';
}

function audTag(c){
  return c.audience==='members'
    ?'<span class="tag lock">'+T().aud+'</span>'
    :'';
}

function eventRow(ev,withButton){
  var p=ev.date.split('-');
  var x=L(ev);
  return '<div class="ev">'+
    '<div class="date"><b>'+(+p[2])+'</b><span>'+MONTHS[lang][+p[1]-1]+'</span></div>'+
    '<div class="evb">'+
      '<strong>'+esc(x.t)+'</strong>'+
      '<p>'+fmtDate(ev.date,true)+(ev.time?' – '+fmtTime(ev.time):'')+(x.p?'<br>'+esc(x.p):'')+'</p>'+
      (withButton?'<button type="button" class="btn ghost small" data-cal="'+esc(ev.id)+'">'+T().addCal+'</button>':'')+
    '</div></div>';
}

function renderHome(){
  var next=upcoming()[0];
  $('nextEvent').innerHTML=next
    ?eventRow(next,false)
    :'<p class="empty">'+T().noEvent+'</p>';

  var recent=sortedNews().slice(0,3);
  $('recentList').innerHTML=recent.length
    ?recent.map(function(c){
        return '<li class="item '+(c.cat==='urgent'?'urgent':'')+'">'+
          '<button type="button" class="head" data-open="'+esc(c.id)+'">'+
            '<span class="ht">'+
              '<span class="meta">'+tagHTML(c)+audTag(c)+'<time>'+fmtDate(c.date)+'</time></span>'+
              '<span class="tt">'+esc(L(c).t)+'</span>'+
            '</span>'+
          '</button></li>';
      }).join('')
    :'<li class="empty">'+T().empty+'</li>';
}

function renderFilters(){
  var t=T();
  var keys=[
    ['all',t.fAll],
    ['urgent',t.fUrgent],
    ['statut',t.fStatut],
    ['events',t.fEvents]
  ];
  $('filters').innerHTML=keys.map(function(k){
    return '<button type="button" class="fbtn" data-filter="'+k[0]+'" aria-pressed="'+(filter===k[0])+'">'+k[1]+'</button>';
  }).join('');
}

function renderNews(){
  var t=T();
  var list=sortedNews().filter(function(c){
    return filter==='all'||c.cat===filter;
  });
  $('newsList').innerHTML=list.length
    ?list.map(function(c){
        var open=openId===c.id;
        var id=esc(c.id);
        return '<li class="item '+(c.cat==='urgent'?'urgent':'')+'">'+
          '<button type="button" class="head" data-item="'+id+'" aria-expanded="'+open+'" aria-controls="p-'+id+'">'+
            '<span class="ht">'+
              '<span class="meta">'+tagHTML(c)+audTag(c)+'<time>'+fmtDate(c.date)+'</time></span>'+
              '<span class="tt">'+esc(L(c).t)+'</span>'+
            '</span>'+CHEV+
          '</button>'+
          '<div class="panel" id="p-'+id+'"'+(open?'':' hidden')+'>'+
            paras(L(c).b)+
            '<button type="button" class="btn ghost small" data-share="'+id+'">'+t.share+'</button>'+
          '</div></li>';
      }).join('')
    :'<li class="empty">'+t.empty+'</li>';
}

function renderAgenda(){
  var list=upcoming();
  $('eventList').innerHTML=list.length
    ?list.map(function(ev){return '<li>'+eventRow(ev,true)+'</li>';}).join('')
    :'<li class="empty">'+T().noEvent+'</li>';
}

/* ================= MON ESPACE ================= */

function monthYear(ms){
  var d=new Date(ms);
  return MONTHS[lang][d.getMonth()]+' '+d.getFullYear();
}

function cardHTML(m){
  var t=T();
  var name=m.name||(S.user&&S.user.name)||'';
  var sub=[m.etab,provName(m.prov)].filter(Boolean).join(' – ');
  return '<div class="mcard">'+
    '<div class="mtop"><span class="mmark">'+MARK+'</span><span>'+esc(t.brandName)+'</span></div>'+
    '<div class="mname">'+esc(name)+'</div>'+
    (sub?'<div class="msub">'+esc(sub)+'</div>':'')+
    '<div class="mfoot">'+
      '<div><span>'+t.cardNo+'</span><b>'+esc(m.memberNo||'—')+'</b></div>'+
      (m.activatedAt?'<div><span>'+t.cardSince+'</span><b>'+esc(monthYear(m.activatedAt))+'</b></div>':'')+
    '</div></div>';
}

function renderProvOptions(){
  var sel=$('pfProv');
  var prev=sel.value;
  sel.innerHTML='<option value="">'+T().phSelect+'</option>'+
    PROVS.map(function(o){
      return '<option value="'+o.v+'">'+o[lang]+'</option>';
    }).join('');
  sel.value=prev||'';
}

function fillForm(force){
  if(!S.user)return;
  if(S.formDirty&&!force)return;
  var m=S.member||{};
  $('pfName').value=m.name||S.user.name||'';
  $('pfEtab').value=m.etab||'';
  $('pfProv').value=m.prov||'';
  $('pfPhone').value=m.phone||'';
}

function renderMe(){
  var t=T();
  var msg=$('meMsg');
  var out=$('meOut');
  var inn=$('meIn');
  msg.hidden=out.hidden=inn.hidden=true;

  if(S.cloud==='loading'){msg.textContent=t.meLoading;msg.hidden=false;return;}
  if(S.cloud==='error'){msg.textContent=t.meOffline;msg.hidden=false;return;}
  if(!S.user){out.hidden=false;return;}

  inn.hidden=false;
  var m=S.member;
  var st=$('meStatus');
  if(m&&t['st_'+m.status]){
    st.hidden=false;
    st.className='statusline '+m.status;
    st.textContent=t['st_'+m.status];
  }else{
    st.hidden=true;
  }
  $('meCard').innerHTML=(m&&m.status==='active')?cardHTML(m):'';
  fillForm(false);
  $('meAdminLink').hidden=!S.isAdmin;
}

function renderAccountButton(){
  var btn=$('meBtn');
  btn.hidden=!CLOUD_ON;
  if(!CLOUD_ON)return;
  btn.innerHTML=(S.user&&S.user.photo)
    ?'<img src="'+esc(S.user.photo)+'" alt="" referrerpolicy="no-referrer">'
    :PERSON;
}

/* ================= ADMINISTRATION ================= */

function nextNo(){
  var max=0;
  S.members.forEach(function(m){
    var x=/(\d+)\s*$/.exec(m.memberNo||'');
    if(x)max=Math.max(max,+x[1]);
  });
  return 'SM-'+('000'+(max+1)).slice(-4);
}

function findMember(uid){
  return S.members.filter(function(m){return m.uid===uid;})[0];
}

function memberRow(m){
  var uid=esc(m.uid);
  var acts='';
  if(m.status==='pending')
    acts+='<button type="button" class="btn primary small" data-adm-act="activate" data-uid="'+uid+'">Valider</button>';
  if(m.status==='active')
    acts+='<button type="button" class="btn ghost small" data-adm-act="block" data-uid="'+uid+'">Suspendre</button>';
  if(m.status==='blocked')
    acts+='<button type="button" class="btn ghost small" data-adm-act="unblock" data-uid="'+uid+'">Réactiver</button>';
  acts+='<button type="button" class="btn ghost small danger" data-adm-act="delMember" data-uid="'+uid+'">Supprimer</button>';

  var info=[m.etab,provName(m.prov,'fr'),m.phone].filter(Boolean).join(' – ');
  return '<li class="mrow">'+
    '<div class="mi">'+
      '<strong>'+esc(m.name||'(sans nom)')+' <span class="tag st-'+esc(m.status)+'">'+esc(STATUS_FR[m.status]||m.status)+'</span></strong>'+
      '<span>'+esc(m.email)+'</span>'+
      (info?'<span>'+esc(info)+'</span>':'')+
      (m.memberNo?'<span>N° '+esc(m.memberNo)+'</span>':'')+
    '</div>'+
    '<div class="mact">'+acts+'</div>'+
  '</li>';
}

function renderAdminMembers(){
  var c={pending:0,active:0,blocked:0,all:S.members.length};
  S.members.forEach(function(m){if(c[m.status]!=null)c[m.status]++;});
  var keys=[
    ['pending','En attente'],
    ['active','Actifs'],
    ['blocked','Suspendus'],
    ['all','Tous']
  ];
  $('admMemFilters').innerHTML=keys.map(function(k){
    return '<button type="button" class="fbtn" data-memf="'+k[0]+'" aria-pressed="'+(S.memFilter===k[0])+'">'+k[1]+' ('+c[k[0]]+')</button>';
  }).join('');
  var list=S.members
    .filter(function(m){return S.memFilter==='all'||m.status===S.memFilter;})
    .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  $('admMemList').innerHTML=list.length
    ?list.map(memberRow).join('')
    :'<li class="empty">Aucun membre dans cette catégorie.</li>';
}

function fmtDateFr(str){
  var p=String(str).split('-');
  return (+p[2])+' '+MONTHS.fr[+p[1]-1]+' '+p[0];
}

function renderAdminNews(){
  var list=sortedNews();
  $('admNewsList').innerHTML=list.length
    ?list.map(function(c){
        var cat=CATS[c.cat]?CATS[c.cat].fr:c.cat;
        return '<li class="mrow">'+
          '<div class="mi">'+
            '<strong>'+esc(titleFr(c))+'</strong>'+
            '<span>'+fmtDateFr(c.date)+' – '+esc(cat)+(c.audience==='members'?' – réservé aux adhérents':'')+'</span>'+
          '</div>'+
          '<div class="mact"><button type="button" class="btn ghost small danger" data-adm-act="delNews" data-id="'+esc(c.id)+'">Supprimer</button></div>'+
        '</li>';
      }).join('')
    :'<li class="empty">Aucun communiqué.</li>';
}

function renderAdminEvents(){

function fileToDataUrl(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(String(r.result||''));};
    r.onerror=function(){reject(new Error('read'));};
    r.readAsDataURL(file);
  });
}

function onReportFileChange(){
  var f=$('rfFile').files&&$('rfFile').files[0];
  var nameEl=$('rfFileName');
  if(!f){
    S.rfFile=null;
    nameEl.hidden=true;
    nameEl.textContent='';
    return;
  }
  if(f.size>RF_MAX_FILE){
    toast(T().rfFileTooBig,5000);
    $('rfFile').value='';
    S.rfFile=null;
    nameEl.hidden=true;
    nameEl.textContent='';
    return;
  }
  S.rfFile=f;
  nameEl.hidden=false;
  nameEl.innerHTML=esc(T().rfFileSelected)+' <b>'+esc(f.name)+'</b> ('+Math.round(f.size/1024)+' Ko)';
}

function submitReport(ev){
  ev.preventDefault();
  var c=cloud();
  if(!c){toast(T().meOffline,4000);return;}
  if(!S.user){toast(T().rfAuthRequired,5000);return;}

  var desc=val('rfMsg');
  if(!desc){toast(T().rfMsgRequired,4000);$('rfMsg').focus();return;}
  if(desc.length>4000){toast(T().rfMsgTooLong,4000);return;}

  var catEl=document.querySelector('input[name="rfCat"]:checked');
  var category=catEl?catEl.value:'autre';

  var anonymous = $('rfAnon').getAttribute('aria-checked')==='true';
  var etab = val('rfEtab');
  var provV = $('rfProv').value;
  var location = val('rfLocation');
  var dateVal = val('rfDate') || todayStr();

  var fullEtab = [etab, provName(provV, lang)].filter(Boolean).join(' – ');
  if(!fullEtab) fullEtab = etab || '';

  var submitBtn=$('rfSubmit');
  submitBtn.disabled=true;
  var oldLabel=submitBtn.textContent;
  submitBtn.textContent=T().rfSending;

  var data={
    ownerUid: anonymous ? '' : (S.user.uid||''),
    anonymous: anonymous,
    name: anonymous ? '' : (S.user.name||''),
    etab: fullEtab.slice(0,120),
    category: String(category).slice(0,60),
    description: desc.slice(0,4000),
    date: dateVal,
    location: String(location).slice(0,120),
    attachmentName: '',
    attachmentType: '',
    attachmentData: '',
    status: 'pending',
    response: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  var filePromise = S.rfFile
    ? fileToDataUrl(S.rfFile).then(function(d){
        data.attachmentName = String(S.rfFile.name||'').slice(0,120);
        data.attachmentType = String(S.rfFile.type||'').slice(0,80);
        data.attachmentData = String(d).slice(0,420000);
      })
    : Promise.resolve();

  filePromise
    .then(function(){ return c.addReport(data); })
    .then(function(ref){
      var code=(ref&&(ref.ref||ref.id||ref.reference))||'';
      if(code && /^[A-Za-z0-9]{10,}$/.test(String(code)))
        code = String(code).slice(-8).toUpperCase();
      $('reportRef').textContent = code || ('SM-'+Date.now().toString(36).toUpperCase().slice(-6));
      $('reportForm').hidden=true;
      $('reportDone').hidden=false;
      resetReportForm();
      toast(T().rfSent);
    })
    .catch(function(err){
      showError(err);
    })
    .then(function(){
      submitBtn.disabled=false;
      submitBtn.textContent=oldLabel;
    });
}

/* ================= CALENDRIER ================= */

function icsText(s){
  return String(s||'')
    .replace(/\\/g,'\\\\')
    .replace(/;/g,'\\;')
    .replace(/,/g,'\\,')
    .replace(/\n/g,'\\n');
}

function icsLocal(d){
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}

function addToCalendar(id){
  var ev=EVENTS.filter(function(e){return e.id===id;})[0];
  if(!ev)return;
  var p=ev.date.split('-');
  var tm=(ev.time||'09:00').split(':');
  var start=new Date(+p[0],+p[1]-1,+p[2],+tm[0],+tm[1]||0);
  var end=new Date(start.getTime()+2*3600000);
  var x=L(ev);
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  var ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UGTM Souss-Massa//FR',
    'BEGIN:VEVENT',
    'UID:'+ev.id+'@ugtm-souss-massa',
    'DTSTAMP:'+stamp,
    'DTSTART:'+icsLocal(start),
    'DTEND:'+icsLocal(end),
    'SUMMARY:'+icsText(x.t),
    'LOCATION:'+icsText(x.p),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  download('evenement-'+ev.id+'.ics','text/calendar;charset=utf-8',ics);
}

/* ================= CLICS ================= */

document.addEventListener('click',function(e){
  var el=e.target.closest(
    '[data-go],[data-tab],[data-item],[data-open],'+
    '[data-filter],[data-form],[data-link],[data-share],'+
    '[data-cal],[data-act],[data-adm],[data-adm-act],[data-memf],'+
    '#installBtn,#langBtn,#rfAnon'
  );
  if(!el)return;

  var c,uid,m,id;

  if(el.id==='langBtn'){
    lang=lang==='fr'?'ar':'fr';
    try{localStorage.setItem('ugtm-lang',lang);}catch(err){}
    applyI18n();
    return;
  }

  if(el.id==='installBtn'){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall=null;
      el.hidden=true;
    }
    return;
  }

  if(el.id==='rfAnon'){
    var cur=el.getAttribute('aria-checked')==='true';
    el.setAttribute('aria-checked',String(!cur));
    return;
  }

  if(el.hasAttribute('data-go')){go(el.getAttribute('data-go'));return;}
  if(el.hasAttribute('data-tab')){go(el.getAttribute('data-tab'));return;}

  if(el.hasAttribute('data-form')){
    go('report');
    renderReportForm();
    return;
  }

  if(el.hasAttribute('data-link')){
    openUrl(linkFor(el.getAttribute('data-link')));
    return;
  }

  if(el.hasAttribute('data-open')){
    openId=el.getAttribute('data-open');
    filter='all';
    renderFilters();
    renderNews();
    go('news');
    return;
  }

  if(el.hasAttribute('data-item')){
    id=el.getAttribute('data-item');
    openId=(openId===id)?null:id;
    renderNews();
    return;
  }

  if(el.hasAttribute('data-filter')){
    filter=el.getAttribute('data-filter');
    openId=null;
    renderFilters();
    renderNews();
    return;
  }

  if(el.hasAttribute('data-cal')){
    addToCalendar(el.getAttribute('data-cal'));
    return;
  }

  if(el.hasAttribute('data-share')){
    var n=NEWS.filter(function(x){return x.id===el.getAttribute('data-share');})[0];
    if(n){
      openUrl('https://wa.me/?text='+encodeURIComponent(L(n).t+'\n'+location.href.split('#')[0]));
    }
    return;
  }

  /* --- Espace membre --- */
  if(el.hasAttribute('data-act')){
    c=cloud();if(!c)return;
    var act=el.getAttribute('data-act');

    if(act==='signin'){
      c.signIn().catch(showError);
    }else if(act==='signout'){
      c.signOut().catch(showError);
    }else if(act==='save'){
      c.saveProfile({
        name:val('pfName'),
        etab:val('pfEtab'),
        prov:$('pfProv').value,
        phone:val('pfPhone')
      }).then(function(){
        S.formDirty=false;
        toast(T().saved);
      }).catch(showError);
    }else if(act==='deldata'){
      if(window.confirm(T().delConfirm)){
        c.deleteAccount().then(function(){
          S.formDirty=false;
          toast(T().deleted);
          go('home');
        }).catch(showError);
      }
    }
    return;
  }

  /* --- Administration --- */
  if(el.hasAttribute('data-adm')){
    showAdmTab(el.getAttribute('data-adm'));
    return;
  }

  if(el.hasAttribute('data-memf')){
    S.memFilter=el.getAttribute('data-memf');
    renderAdminMembers();
    return;
  }

  if(el.hasAttribute('data-adm-act')){
    if(!S.isAdmin)return;
    c=cloud();if(!c)return;
    var a=el.getAttribute('data-adm-act');
    uid=el.getAttribute('data-uid');
    id=el.getAttribute('data-id');
    m=uid?findMember(uid):null;

    if(a==='activate'&&m){
      var no=window.prompt("Numéro d'adhérent pour "+(m.name||m.email)+" :",m.memberNo||nextNo());
      if(no===null)return;
      no=no.trim();
      if(!no)return;
      c.admin.setStatus(uid,'active',no)
        .then(function(){toast('Adhérent validé');})
        .catch(showError);
    }
    else if(a==='block'&&m){
      if(window.confirm('Suspendre '+(m.name||m.email)+' ?'))
        c.admin.setStatus(uid,'blocked').catch(showError);
    }
    else if(a==='unblock'&&m){
      c.admin.setStatus(uid,'active').catch(showError);
    }
    else if(a==='delMember'&&m){
      if(window.confirm('Supprimer définitivement le profil de '+(m.name||m.email)+' ?'))
        c.admin.deleteMember(uid).catch(showError);
    }
    else if(a==='addNews'){publishNews();}
    else if(a==='addEvent'){publishEvent();}
    else if(a==='delNews'){
      if(window.confirm('Supprimer ce communiqué ?'))
        c.admin.deleteNews(id).catch(showError);
    }
    else if(a==='delEvent'){
      if(window.confirm('Supprimer cet événement ?'))
        c.admin.deleteEvent(id).catch(showError);
    }
    else if(a==='csv'){exportCsv();}
    return;
  }
});
