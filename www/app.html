<!DOCTYPE html><html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UGTM Souss-Massa</title>
<meta name="description" content="Application de la Fédération régionale UGTM Souss-Massa : communiqués, agenda, signalements et contacts.">
<meta name="theme-color" content="#B83268">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UGTM SM"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{
  --bg:#FFF7FA;
  --surface:#FFFFFF;
  --ink:#24191F;
  --muted:#75656C;
  --line:#EAD9E0;

  --primary:#B83268;
  --on-primary:#FFFFFF;
  --link:#B83268;

  --accent:#D7A72C;
  --on-accent:#241C08;

  --alert:#B51F2A;
  --soft:#FCECF3;
  --focus:#C94B7D;

  --ok:#B83268;

  --font-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-head:"Cairo","IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A0D13;
    --surface:#24121A;
    --ink:#FFF0F5;
    --muted:#C7AEB8;
    --line:#432532;

    --primary:#A92F60;
    --on-primary:#FFFFFF;
    --link:#F08BB2;

    --accent:#E2B33B;
    --on-accent:#211804;

    --alert:#FF777D;
    --soft:#351B27;
    --focus:#F08BB2;

    --ok:#F08BB2;
  }
}

:root[data-theme="dark"]{
  --bg:#1A0D13;
  --surface:#24121A;
  --ink:#FFF0F5;
  --muted:#C7AEB8;
  --line:#432532;

  --primary:#A92F60;
  --on-primary:#FFFFFF;
  --link:#F08BB2;

  --accent:#E2B33B;
  --on-accent:#211804;

  --alert:#FF777D;
  --soft:#351B27;
  --focus:#F08BB2;

  --ok:#F08BB2;
}

*,*::before,*::after{
  box-sizing:inherit
}

html{
  height:100%;
  background:var(--surface);
  scroll-padding-top:env(safe-area-inset-top,0px)
}

body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%
}

[dir="rtl"] body{
  line-height:1.75
}

button,input,select,textarea{
  font:inherit;
  color:inherit
}

:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px
}

[hidden]{
  display:none!important
}

.app{
  max-width:480px;
  height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  background:var(--bg)
}

@media (min-width:520px){
  .app{
    border-inline:1px solid var(--line)
  }
}

/* =========================
   EN-TÊTE
   ========================= */

.top{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line)
}

.mark{
  width:40px;
  height:40px;
  border-radius:11px;
  background:var(--primary);
  display:grid;
  place-items:center;
  flex:none
}

.brand{
  flex:1;
  min-width:0
}

.brand b{
  display:block;
  font-family:var(--font-head);
  font-weight:800;
  font-size:15px;
  line-height:1.3
}

.brand span{
  display:block;
  font-size:12.5px;
  color:var(--muted);
  line-height:1.4
}

.langbtn{
  flex:none;
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--bg);
  font-weight:600;
  font-size:14px;
  cursor:pointer
}

.notice{
  background:var(--soft);
  color:var(--muted);
  font-size:12.5px;
  text-align:center;
  padding:5px 16px
}

/* =========================
   CONTENU
   ========================= */

main{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:16px 16px 28px
}

.title{
  font-family:var(--font-head);
  font-weight:800;
  font-size:24px;
  line-height:1.3;
  margin:4px 0 12px
}

.lead{
  margin:0 0 18px;
  color:var(--muted)
}

.sechead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin:26px 0 8px
}

.sechead h2{
  font-family:var(--font-head);
  font-weight:600;
  font-size:18px;
  margin:0
}

.link{
  background:none;
  border:0;
  padding:6px 0;
  color:var(--link);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:3px
}

/* =========================
   HERO
   ========================= */

.hero{
  background:var(--primary);
  color:var(--on-primary);
  border-radius:20px;
  padding:22px 20px 20px;
  border-inline-start:6px solid var(--accent)
}

.hero h1{
  font-family:var(--font-head);
  font-weight:800;
  font-size:24px;
  line-height:1.3;
  margin:0 0 8px
}

.hero p{
  margin:0 0 18px;
  color:rgba(255,255,255,.88)
}

/* =========================
   BOUTONS
   ========================= */

.btn{
  min-height:46px;
  padding:0 20px;
  border-radius:12px;
  border:0;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.btn.gold{
  background:var(--accent);
  color:var(--on-accent)
}

.btn.primary{
  background:var(--primary);
  color:var(--on-primary)
}

.btn.ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink)
}

.btn.small{
  min-height:38px;
  padding:0 14px;
  font-size:14px
}

.btn.block{
  width:100%
}

/* =========================
   LISTES
   ========================= */

.list{
  list-style:none;
  margin:0;
  padding:0;
  border-top:1px solid var(--line)
}

.item{
  border-bottom:1px solid var(--line)
}

.item.urgent{
  border-inline-start:3px solid var(--alert);
  padding-inline-start:12px
}

.head{
  width:100%;
  background:none;
  border:0;
  padding:14px 0;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:start;
  cursor:pointer
}

.ht{
  flex:1;
  min-width:0;
  display:block
}

.meta{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:2px
}

.tt{
  display:block;
  font-weight:600;
  font-size:16px;
  line-height:1.45
}

.tag{
  font-size:12px;
  font-weight:600;
  padding:1px 8px;
  border-radius:4px;
  background:var(--soft);
  color:var(--ink)
}

.tag.urgent{
  background:transparent;
  color:var(--alert);
  border:1px solid var(--alert)
}

.chev{
  flex:none;
  color:var(--muted);
  transition:transform .2s
}

.head[aria-expanded="true"] .chev{
  transform:rotate(180deg)
}

.panel{
  padding:0 0 16px
}

.panel p{
  margin:0 0 12px;
  color:var(--ink)
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px
}

.fbtn{
  flex:none;
  min-height:38px;
  padding:0 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  font-weight:500;
  font-size:14px;
  cursor:pointer
}

.fbtn[aria-pressed="true"]{
  background:var(--primary);
  border-color:var(--primary);
  color:var(--on-primary)
}

/* =========================
   AGENDA
   ========================= */

.ev{
  display:flex;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  align-items:flex-start
}

.events{
  list-style:none;
  margin:0;
  padding:0;
  border-top:1px solid var(--line)
}

.date{
  flex:none;
  width:56px;
  text-align:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:6px 0 5px
}

.date b{
  display:block;
  font-family:var(--font-head);
  font-weight:800;
  font-size:22px;
  line-height:1.1
}

.date span{
  display:block;
  font-size:12px;
  color:var(--muted)
}

.evb{
  flex:1;
  min-width:0
}

.evb strong{
  display:block;
  font-size:16px;
  line-height:1.45
}

.evb p{
  margin:2px 0 8px;
  font-size:14px;
  color:var(--muted)
}

.nextcard{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.nextcard .ev{
  border-bottom:0
}

/* =========================
   FORMULAIRE
   ========================= */

.field{
  margin:0 0 18px;
  padding:0;
  border:0;
  min-width:0
}

.field label,
.field legend{
  display:block;
  font-weight:600;
  font-size:14.5px;
  margin-bottom:6px;
  padding:0
}

.field input[type="text"],
.field input[type="tel"],
.field input[type="date"],
.field input[type="time"],
.field select,
.field textarea{
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  font-size:16px
}

.field textarea{
  resize:vertical;
  min-height:120px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.chip{
  position:relative
}

.chip input{
  position:absolute;
  opacity:0;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  cursor:pointer
}

.chip span{
  display:inline-flex;
  align-items:center;
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  font-size:14px
}

.chip input:checked + span{
  background:var(--primary);
  border-color:var(--primary);
  color:var(--on-primary);
  font-weight:600
}

.chip input:focus-visible + span{
  outline:3px solid var(--focus);
  outline-offset:2px
}

.err{
  color:var(--alert);
  font-size:14px;
  margin:6px 0 0;
  font-weight:500
}

.switchrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px;
  margin:0 0 18px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px
}

.switchrow b{
  display:block;
  font-size:15px
}

.switchrow p{
  margin:0;
  font-size:13.5px;
  color:var(--muted);
  line-height:1.5
}

.sw{
  position:relative;
  flex:none;
  width:52px;
  height:30px;
  border-radius:999px;
  border:0;
  background:var(--line);
  cursor:pointer;
  transition:background .2s
}

.sw::after{
  content:"";
  position:absolute;
  top:3px;
  inset-inline-start:3px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:inset-inline-start .2s
}

.sw[aria-checked="true"]{
  background:var(--primary)
}

.sw[aria-checked="true"]::after{
  inset-inline-start:25px
}

.hint{
  font-size:13.5px;
  color:var(--muted);
  margin:0 0 16px
}

.done{
  background:var(--surface);
  border:1px solid var(--line);
  border-inline-start:6px solid var(--accent);
  border-radius:16px;
  padding:20px
}

.done h1{
  font-family:var(--font-head);
  font-weight:800;
  font-size:22px;
  margin:0 0 8px
}

.done p{
  margin:0 0 10px
}

.ref{
  font-family:var(--font-head);
  font-weight:800;
  font-size:22px;
  letter-spacing:.04em;
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block
}

/* =========================
   CONTACT
   ========================= */

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line)
}

.rows{
  border-top:1px solid var(--line)
}

.ico{
  flex:none;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--soft);
  color:var(--link);
  display:grid;
  place-items:center
}

.rb{
  flex:1;
  min-width:0
}

.rb strong{
  display:block;
  font-size:16px
}

.rb p{
  margin:0;
  font-size:13.5px;
  color:var(--muted);
  line-height:1.5
}

.install{
  margin-top:24px;
  padding:16px;
  border-radius:14px;
  background:var(--soft)
}

.install h2{
  font-family:var(--font-head);
  font-weight:600;
  font-size:17px;
  margin:0 0 6px
}

.install p{
  margin:0;
  font-size:14.5px
}

.install .ios{
  margin-top:8px
}

.install .btn{
  margin-top:14px
}

/* =========================
   BARRE D'ONGLETS
   ========================= */

.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--surface);
  border-top:1px solid var(--line);
  padding:4px 4px 6px;
  position:relative;
  z-index:2
}

.tab{
  background:none;
  border:0;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:3px;
  min-height:54px;
  padding:4px 2px;
  font-size:12px;
  font-weight:500;
  cursor:pointer
}

.tab[aria-selected="true"]{
  color:var(--link);
  font-weight:600
}

.tab .bubble{
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--accent);
  color:var(--on-accent);
  display:grid;
  place-items:center;
  margin-top:-22px;
  box-shadow:0 0 0 5px var(--surface)
}

/* =========================
   TOAST
   ========================= */

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(92px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);
  background:var(--ink);
  color:var(--bg);
  padding:10px 16px;
  border-radius:999px;
  font-size:14px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:5
}

.toast.show{
  opacity:1
}

/* =========================
   AUTRES
   ========================= */

@media (prefers-reduced-motion:reduce){
  *{
    transition:none!important;
    animation:none!important
  }
}

.points{
  margin:0 0 4px;
  padding-inline-start:20px
}

.points li{
  margin-bottom:8px
}

.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:22px
}

.empty{
  padding:16px 0;
  color:var(--muted);
  list-style:none;
  margin:0
}

.acctbtn{
  flex:none;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--bg);
  display:grid;
  place-items:center;
  cursor:pointer;
  overflow:hidden;
  padding:0;
  color:var(--ink)
}

.acctbtn img{
  width:100%;
  height:100%;
  object-fit:cover
}

.h2{
  font-family:var(--font-head);
  font-weight:600;
  font-size:18px;
  margin:8px 0 12px
}

.danger{
  color:var(--alert)
}

.link.danger{
  margin-top:4px
}

.statusline{
  padding:12px 14px;
  border-radius:12px;
  background:var(--soft);
  font-weight:500;
  margin:0 0 16px;
  border-inline-start:4px solid var(--accent)
}

.statusline.active{
  border-inline-start-color:var(--ok)
}

.statusline.blocked{
  border-inline-start-color:var(--alert)
}

/* =========================
   CARTE MEMBRE
   ========================= */

.mcard{
  background:var(--primary);
  color:#fff;
  border-radius:18px;
  padding:18px 18px 16px;
  border-inline-start:6px solid var(--accent);
  margin:0 0 22px
}

.mtop{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--font-head);
  font-weight:600;
  font-size:14px
}

.mmark{
  width:28px;
  height:28px;
  border-radius:8px;
  background:rgba(255,255,255,.14);
  display:grid;
  place-items:center;
  flex:none
}

.mname{
  font-family:var(--font-head);
  font-weight:800;
  font-size:22px;
  line-height:1.3;
  margin:16px 0 2px
}

.msub{
  color:rgba(255,255,255,.84);
  font-size:14.5px
}

.mfoot{
  display:flex;
  gap:28px;
  margin-top:18px
}

.mfoot span{
  display:block;
  font-size:12.5px;
  color:rgba(255,255,255,.74)
}

.mfoot b{
  font-family:var(--font-head);
  font-weight:800;
  font-size:17px;
  letter-spacing:.03em;
  direction:ltr;
  unicode-bidi:isolate;
  display:inline-block
}

.tag.lock{
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted)
}

.tag.st-active{
  background:transparent;
  border:1px solid var(--ok);
  color:var(--ok)
}

.tag.st-blocked{
  background:transparent;
  border:1px solid var(--alert);
  color:var(--alert)
}

.mrow{
  display:flex;
  gap:12px;
  align-items:flex-start;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  list-style:none
}

.mi{
  flex:1;
  min-width:0
}

.mi strong{
  display:block;
  font-size:16px;
  line-height:1.45
}

.mi span{
  display:block;
  font-size:13.5px;
  color:var(--muted);
  overflow-wrap:anywhere
}

.mi strong .tag{
  display:inline-block;
  vertical-align:middle;
  margin-inline-start:6px
}

.mact{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:none
}

.adm{
  direction:ltr
}

.adm *{
  direction:ltr
}
</style></head><body><div class="app"><header class="top"><div class="mark" aria-hidden="true">

</svg>
</div><div class="brand">
<b data-i18n="brandName"></b>
<span data-i18n="brandSub"></span>
</div><button class="acctbtn" id="meBtn" type="button" hidden data-go="me"></button>

<button class="langbtn" id="langBtn" type="button"></button>

<p data-i18n="heroP"></p>

<h2 data-i18n="nextT"></h2>
<button class="link" type="button" data-go="agenda" data-i18n="seeAgenda"></button>

<button class="link" type="button" data-go="news" data-i18n="seeAll"></button>
</div><ul class="list" id="recentList"></ul></section><!-- Communiqués --><section class="screen" id="s-news" hidden><h1 class="title" data-i18n="newsT"></h1><div class="filters" id="filters" role="group"></div><ul class="list" id="newsList"></ul></section><!-- Signalement --><section class="screen" id="s-report" hidden><h1 class="title" data-i18n="reportT"></h1><p class="lead" data-i18n="reportP"></p><ul class="points">

   ========================= */

function icsText(s){

return String(s||'')
.replace(/\\/g,'\\\\')
.replace(/;/g,'\\;')
.replace(/,/g,'\\,')
.replace(/\n/g,'\\n');

}

function icsLocal(d){

return d.getFullYear()+
pad(d.getMonth()+1)+
pad(d.getDate())+
'T'+
pad(d.getHours())+
pad(d.getMinutes())+
'00';

}

function addToCalendar(id){

var ev=EVENTS.filter(function(e){
return e.id===id;
})[0];

if(!ev)return;

var p=ev.date.split('-');

var tm=(ev.time||'09:00').split(':');

var start=new Date(
+p[0],
+p[1]-1,
+p[2],
+tm[0],
+tm[1]||0
);

var end=new Date(
start.getTime()+2*3600000
);

var x=L(ev);

var stamp=new Date()
.toISOString()
.replace(/[-:]/g,'')
.replace(/\.\d{3}/,'');

var ics=[
'BEGIN:VCALENDAR',
'VERSION:2.0',
'PRODID:-//UGTM Souss-Massa//FR',
'BEGIN:VEVENT',
'UID:'+ev.id+'@ugtm-souss-massa',
'DTSTAMP:'+stamp,
'DTSTART:'+icsLocal(start),
'DTEND:'+icsLocal(end),
'SUMMARY:'+icsText(x.t),
'LOCATION:'+icsText(x.p),
'END:VEVENT',
'END:VCALENDAR'
].join('\r\n');

download(
'evenement-'+ev.id+'.ics',
'text/calendar;charset=utf-8',
ics
);

}

}

else if(a==='delEvent'){

if(window.confirm('Supprimer cet événement ?'))

c.admin
.deleteEvent(id)
.catch(showError);

}

else if(a==='csv'){

exportCsv();

}

return;
}

});
