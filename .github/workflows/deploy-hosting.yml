name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer la CLI Firebase
        run: npm install -g firebase-tools

      - name: Préparer le compte de service
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > sa.json

      - name: Publier les règles Firestore
        run: firebase deploy --only firestore:rules --project ugtm-fns-souss-massa --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ugtm-fns-souss-massa
          channelId: live
          entryPoint: .
