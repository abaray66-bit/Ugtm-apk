name: Build Android APK Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Get APK info
        id: apk-info
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk-info.outputs.apk_path }}
          tag_name: ${{ steps.apk-info.outputs.tag }}
          generate_release_notes: false

      - name: Update update.json
        run: |
          VERSION="${{ steps.apk-info.outputs.version }}"
          SHA256="${{ steps.apk-info.outputs.sha256 }}"
          TAG="${{ steps.apk-info.outputs.tag }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ TAG }}/app-release.apk"

          node -e "
            const fs = require('fs');
            const path = 'www/update.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.versionName = '$VERSION';
            data.apkUrl = '$APK_URL';
            data.sha256 = '$SHA256';
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          "

      - name: Commit and push update.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/update.json
          git commit -m "chore: update.json for ${{ steps.apk-info.outputs.tag }}" || echo "No changes to commit"
          git push origin main
