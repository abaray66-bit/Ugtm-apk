name: Build Android APK + AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier le projet
        run: |
          set -e
          ls -la
          for f in package.json capacitor.config.json firestore.rules; do
            [ -f "$f" ] || { echo "ERREUR : $f introuvable"; exit 1; }
          done
          [ -d www ] || { echo "ERREUR : dossier www introuvable"; exit 1; }
          echo "Projet UGTM valide."

      - name: Nettoyer les backups dans www
        run: |
          find www -type f \( -name "*.backup*" -o -name "*.bak" \) -delete || true
          echo "Backups supprimés."

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Capacitor Android
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier Capacitor
        run: npx cap --version

      - name: Générer le projet Android
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          [ -n "$GOOGLE_SERVICES_JSON" ] || { echo "ERREUR : secret absent"; exit 1; }
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Configurer Google Services Gradle
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          if root.exists():
              text = root.read_text()
              if "com.google.gms:google-services" not in text:
                  text = ("buildscript {\n    dependencies {\n        classpath "
                          "'com.google.gms:google-services:4.4.2'\n    }\n}\n\n" + text)
                  root.write_text(text)

          app = Path("android/app/build.gradle")
          if app.exists():
              text = app.read_text()
              if "com.google.gms.google-services" not in text:
                  text += "\n\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(text)
          PY

      - name: Installer les icônes UGTM
        run: |
          set -e
          [ -d android-icons ] || { echo "ERREUR : dossier android-icons introuvable"; exit 1; }
          RES="android/app/src/main/res"
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$dens"
            cp android-icons/mipmap-$dens/*.png "$RES/mipmap-$dens/"
          done
          VALUES="$RES/values"
          mkdir -p "$VALUES"
          cp android-icons/ic_launcher_background.xml "$VALUES/"
          echo "Icônes UGTM installées."

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Installer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "ERREUR : keystore absent"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/ugtm-release.keystore
          [ -s android/ugtm-release.keystore ] || { echo "ERREUR : keystore vide"; exit 1; }

      - name: Vérifier le keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          keytool -list -keystore android/ugtm-release.keystore \
            -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD"

      - name: Configurer la signature + minify + shrink
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # --- Supprime ancien signingConfigs
          start = text.find("signingConfigs {")
          if start != -1:
              depth = 0
              end = None
              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end:
                  text = text[:start] + text[end:]

          # --- Nouvelle config signature
          signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          marker = "android {"
          if marker not in text:
              raise SystemExit("ERREUR : bloc android introuvable.")
          text = text.replace(marker, marker + signing, 1)

          # --- buildTypes avec minify + shrink
          if "buildTypes {" in text:
              import re
              text = re.sub(
                  r"buildTypes\s*\{.*?\n\s*\}\n",
                  """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled true
                          shrinkResources true
                          proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      }
                      debug {
                          signingConfig signingConfigs.release
                      }
                  }
          """,
                  text, count=1, flags=re.DOTALL)
          else:
              text += """

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          """

          # --- Config ABI splits (APK par architecture)
          if "splits {" not in text:
              marker = "android {"
              splits = """
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                      universalApk true
                  }
              }
              """
              text = text.replace(marker, marker + splits, 1)

          gradle.write_text(text)
          print("Configuration Gradle patchée.")
          PY

      - name: Installer proguard-rules.pro
        run: |
          set -e
          cat > android/app/proguard-rules.pro <<'PRO'
          # ===== Capacitor =====
          -keep class com.getcapacitor.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keepclassmembers class * {
              @com.getcapacitor.PluginMethod public *;
          }

          # ===== Firebase =====
          -keep class com.google.firebase.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.firebase.**
          -dontwarn com.google.android.gms.**

          # ===== WebView JS =====
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          -keepattributes *Annotation*
          -keepattributes SourceFile,LineNumberTable
          -keepattributes Signature,InnerClasses,EnclosingMethod

          # ===== Cordova fallback =====
          -keep class org.apache.cordova.** { *; }
          -dontwarn org.apache.cordova.**
          PRO
          echo "proguard-rules.pro installé."

      - name: Compiler APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Compiler AAB Release (Play Store)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          ./gradlew bundleRelease

      - name: Vérifier APK
        run: |
          set -e
          APK_DIR="android/app/build/outputs/apk/release"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          echo "=== APKs ==="
          find "$APK_DIR" -type f -name "*.apk" -exec ls -lh {} \;

          echo ""
          echo "=== AAB ==="
          [ -f "$AAB" ] && ls -lh "$AAB" || echo "AAB non généré (optionnel)"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK_UNIV="$APK_DIR/app-universal-release.apk"
          [ -f "$APK_UNIV" ] || APK_UNIV="$APK_DIR/app-release.apk"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose --print-certs "$APK_UNIV"

      - name: Publier APKs
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier AAB
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
