name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers du projet
        run: |
          set -e

          echo "=== Structure du projet ==="
          ls -la

          test -f package.json || {
            echo "ERREUR : package.json introuvable"
            exit 1
          }

          test -d www || {
            echo "ERREUR : dossier www introuvable"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERREUR : capacitor.config.json introuvable"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer les variables
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Installer les dépendances
        run: |
          set -e

          npm install

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/assets@3.0.5

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      - name: Télécharger le logo officiel UGTM
        run: |
          set -e

          mkdir -p resources

          curl -fL --retry 3 \
            "https://ugtm.ma/?wpdmdl=985" \
            -o resources/icon.png

          test -s resources/icon.png || {
            echo "ERREUR : logo UGTM introuvable."
            exit 1
          }

          file resources/icon.png
          ls -lh resources/icon.png

      - name: Créer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Générer les icônes Android
        run: |
          set -e

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"

      - name: Installer Google Services
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Google Services installé."

      - name: Configurer Google Services Gradle
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          if "com.google.gms:google-services" not in s:
              if "buildscript {" in s:
                  marker = "dependencies {"
                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + "\n        classpath 'com.google.gms:google-services:4.4.2'",
                          1
                      )
              else:
                  s = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          """ + s

          p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"

          p.write_text(s)
          PY

      - name: Synchroniser Capacitor
        run: |
          set -e

          npx cap sync android

      - name: Vérifier le projet Android
        run: |
          set -e

          test -f android/gradlew || {
            echo "ERREUR : android/gradlew introuvable."
            exit 1
          }

          chmod +x android/gradlew

          echo "=== Début de android/app/build.gradle ==="
          sed -n '1,120p' android/app/build.gradle

      - name: Configurer la signature APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/ugtm-release.keystore

          test -s android/ugtm-release.keystore || {
            echo "ERREUR : keystore invalide."
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Ajoute signingConfigs juste après le premier android {
          if "signingConfigs {" not in s:
              block = """android {
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              """

              s = s.replace("android {", block, 1)

          # Ajoute la signature dans le build type release existant.
          if "signingConfig signingConfigs.release" not in s:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"

              replacement = (
                  r"\1\n"
                  r"        signingConfig signingConfigs.release"
              )

              s, count = re.subn(pattern, replacement, s, count=1)

              if count == 0:
                  raise SystemExit(
                      "ERREUR : bloc buildTypes/release introuvable."
                  )

          p.write_text(s)
          PY

          echo "=== Signature configurée ==="
          grep -n "signingConfig\|storeFile\|storePassword\|keyAlias" \
            android/app/build.gradle || true

      - name: Vérifier les secrets de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : KEYSTORE_PASSWORD est vide."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERREUR : KEY_ALIAS est vide."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERREUR : KEY_PASSWORD est vide."
            exit 1
          fi

          echo "Les trois paramètres de signature sont présents."

      - name: Build APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleRelease

      - name: Vérifier APK
        run: |
          set -e

          echo "=== APK générés ==="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -ls

          APK=$(find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK Release trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
