name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # VERIFICATION
      # ==========================================================
      - name: Vérifier le projet
        run: |
          set -e

          echo "=== CONTENU DU PROJET ==="
          ls -la

          test -f package.json || {
            echo "ERREUR : package.json introuvable."
            exit 1
          }

          test -d www || {
            echo "ERREUR : dossier www introuvable."
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERREUR : capacitor.config.json introuvable."
            exit 1
          }

          echo "Projet UGTM valide."

      # ==========================================================
      # NODE
      # ==========================================================
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================================
      # DEPENDANCES
      # ==========================================================
      - name: Installer les dépendances
        run: |
          set -e
          npm install

      - name: Installer Capacitor Android
        run: |
          set -e
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Installer Capacitor Assets
        run: |
          set -e
          npm install --save-dev @capacitor/assets@3.0.5

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      # ==========================================================
      # LOGO OFFICIEL UGTM
      # ==========================================================
      - name: Télécharger le logo officiel UGTM
        run: |
          set -e

          mkdir -p resources

          curl -fL --retry 3 \
            "https://ugtm.ma/wp-content/uploads/2022/10/logo-ugtm.png" \
            -o resources/icon.png

          if [ ! -s resources/icon.png ]; then
            echo "ERREUR : impossible de télécharger le logo UGTM."
            exit 1
          fi

          echo "Logo UGTM téléchargé :"
          file resources/icon.png
          ls -lh resources/icon.png

      # ==========================================================
      # PROJET ANDROID
      # ==========================================================
      - name: Générer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Projet Android absent : génération..."
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      # ==========================================================
      # GENERER LES ICONES ANDROID
      # ==========================================================
      - name: Générer les icônes Android UGTM
        run: |
          set -e

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"

          echo "Icônes Android UGTM générées."

      # ==========================================================
      # FIREBASE
      # ==========================================================
      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          echo "google-services.json installé."

      # ==========================================================
      # GOOGLE SERVICES GRADLE
      # ==========================================================
      - name: Configurer Google Services Gradle
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  text = (
                      "buildscript {\n"
                      "    dependencies {\n"
                      "        classpath "
                      "'com.google.gms:google-services:4.4.2'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

                  root.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "com.google.gms.google-services" not in text:
                  text += (
                      "\n\n"
                      "apply plugin: 'com.google.gms.google-services'\n"
                  )

              app.write_text(text)
          PY

      # ==========================================================
      # CAPACITOR SYNC
      # ==========================================================
      - name: Synchroniser Capacitor
        run: |
          set -e
          npx cap sync android

      # ==========================================================
      # KEYSTORE
      # ==========================================================
      - name: Installer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERREUR : ANDROID_KEYSTORE_BASE64 est absent."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/ugtm-release.keystore

          test -s android/ugtm-release.keystore || {
            echo "ERREUR : keystore invalide."
            exit 1
          }

          echo "Keystore installé."

      # ==========================================================
      # VERIFICATION KEYSTORE
      # ==========================================================
      - name: Vérifier le keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          keytool -list \
            -v \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E "Alias name:|SHA1:|SHA256:"

      # ==========================================================
      # SIGNATURE GRADLE
      # ==========================================================
      - name: Configurer la signature Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          start = text.find("signingConfigs {")

          if start != -1:
              depth = 0
              end = None

              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  text = text[:start] + text[end:]

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          if "android {" not in text:
              raise SystemExit("ERREUR : bloc android introuvable.")

          text = text.replace(
              "android {",
              "android {" + signing,
              1
          )

          if "buildTypes {" in text:
              if "signingConfig signingConfigs.release" not in text:
                  text = text.replace(
                      "buildTypes {",
                      """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  """,
                      1
                  )
          else:
              text += """
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """

          gradle.write_text(text)
          PY

      # ==========================================================
      # BUILD APK
      # ==========================================================
      - name: Compiler APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleRelease

      # ==========================================================
      # VERIFIER APK
      # ==========================================================
      - name: Vérifier APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK UGTM GENEREE"
          echo "======================================"

          ls -lh "$APK"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      # ==========================================================
      # ARTIFACT
      # ==========================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
