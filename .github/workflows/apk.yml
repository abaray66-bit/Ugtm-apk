name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trouver et extraire le ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Archive trouvée : $ZIP"
            mkdir -p app
            unzip -o "$ZIP" -d app
            TARGET_DIR="app"
          else
            PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)

            if [ -z "$PKG_PATH" ]; then
              TARGET_DIR="."
            else
              TARGET_DIR=$(dirname "$PKG_PATH")
            fi
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "Projet : $TARGET_DIR"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier capacitor.config.json
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          if [ -f capacitor.config.json ]; then
            echo "Configuration existante :"
            cat capacitor.config.json
          else
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "ma.ugtm.souss.massa",
            "appName": "UGTM Souss-Massa",
            "webDir": "www"
          }
          EOF
          fi

      - name: Générer Android
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Installer google-services.json
        working-directory: ${{ env.TARGET_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : le secret GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              text = (
                  "buildscript {\n"
                  "    dependencies {\n"
                  "        classpath 'com.google.gms:google-services:4.4.2'\n"
                  "    }\n"
                  "}\n\n"
                  + text
              )
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\n\napply plugin: 'com.google.gms.google-services'\n"

          app.write_text(text)
          PY

      - name: Configurer le debug keystore officiel
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo ""
          echo "=========================================="
          echo "SHA-1 DU DEBUG KEYSTORE UTILISE"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA-1:" || true

          echo ""
          echo "=========================================="
          echo "SHA-256 DU DEBUG KEYSTORE UTILISE"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|SHA-256:" || true

      - name: Forcer Gradle à utiliser le debug keystore
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          if "signingConfigs" not in text:
              marker = "android {"
              signing = """
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              """

              if marker in text:
                  text = text.replace(marker, marker + "\n" + signing, 1)

          if "signingConfig signingConfigs.debug" not in text:
              marker = "buildTypes {"
              replacement = """buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
          """

              if marker in text:
                  text = text.replace(marker, replacement, 1)

          gradle.write_text(text)
          PY

          echo "Configuration de signature :"
          grep -n -A15 -B3 "signingConfigs" app/build.gradle || true

      - name: Synchroniser Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap sync android

      - name: Compiler APK
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Vérifier APK
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          ls -lh "$APK"

          echo ""
          echo "=========================================="
          echo "CERTIFICAT REEL DE L'APK"
          echo "=========================================="

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify \
            --print-certs \
            "$APK"

      - name: Afficher SHA-1 final de l'APK
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo ""
          echo "=========================================="
          echo "SHA-1 UTILISE PAR L'APK FINAL"
          echo "=========================================="

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify \
            --print-certs \
            "$APK"

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: ${{ env.TARGET_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
