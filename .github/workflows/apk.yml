name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # VERIFICATION PROJET
      # ==========================================================

      - name: Vérifier le projet
        run: |
          set -e

          echo "=== CONTENU DU PROJET ==="
          ls -la

          if [ ! -f package.json ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          if [ ! -d www ]; then
            echo "ERREUR : dossier www introuvable."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERREUR : capacitor.config.json introuvable."
            exit 1
          fi

          echo "Projet UGTM valide."

      # ==========================================================
      # NODE
      # ==========================================================

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Syntaxe JS + JSON : bloque l'APK si un fichier est cassé.
      - name: Vérifier la syntaxe JavaScript
        run: node tools/check-syntax.js

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================================
      # DEPENDANCES
      # ==========================================================

      - name: Installer les dépendances
        run: |
          set -e
          npm install

      - name: Installer Capacitor Android
        run: |
          set -e
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      # ==========================================================
      # PROJET ANDROID
      # ==========================================================

      - name: Générer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Projet Android absent : génération..."
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      # ==========================================================
      # FIREBASE
      # ==========================================================

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          echo "google-services.json installé."

      # ==========================================================
      # GOOGLE SERVICES GRADLE
      # ==========================================================

      - name: Configurer Google Services Gradle
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  text = (
                      "buildscript {\n"
                      "    dependencies {\n"
                      "        classpath "
                      "'com.google.gms:google-services:4.4.2'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

                  root.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "com.google.gms.google-services" not in text:
                  text += (
                      "\n\n"
                      "apply plugin: 'com.google.gms.google-services'\n"
                  )

              app.write_text(text)
          PY

      # ==========================================================
      # ICÔNES UGTM (lanceur Android)
      # ==========================================================

      - name: Installer les icônes UGTM
        run: |
          set -e

          if [ ! -d android-icons ]; then
            echo "ERREUR : dossier android-icons introuvable."
            exit 1
          fi

          RES="android/app/src/main/res"

          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$dens"
            cp "android-icons/mipmap-$dens/"*.png "$RES/mipmap-$dens/"
          done

          # Fond de l'icône adaptative (blanc)
          VALUES="android/app/src/main/res/values"
          mkdir -p "$VALUES"
          cp android-icons/ic_launcher_background.xml "$VALUES/"

          echo "Icônes UGTM installées :"
          ls "$RES"/mipmap-*/ic_launcher.png

      # ==========================================================
      # CAPACITOR SYNC
      # ==========================================================

      - name: Synchroniser Capacitor
        run: |
          set -e
          npx cap sync android

      # ==========================================================
      # MODULE DE MISE A JOUR AUTOMATIQUE
      # ==========================================================

      - name: Installer le module AppUpdater
        run: |
          set -e

          JAVA_DIR="android/app/src/main/java/ma/ugtm/souss/massa"
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/AppUpdaterPlugin.java" <<'JAVA'
          package ma.ugtm.souss.massa;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdaterPlugin extends Plugin {

              private final ExecutorService executor =
                  Executors.newSingleThreadExecutor();

              @PluginMethod
              public void getVersionCode(PluginCall call) {
                  try {
                      long versionCode;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          versionCode = getContext()
                              .getPackageManager()
                              .getPackageInfo(
                                  getContext().getPackageName(), 0
                              ).getLongVersionCode();
                      } else {
                          versionCode = getContext()
                              .getPackageManager()
                              .getPackageInfo(
                                  getContext().getPackageName(), 0
                              ).versionCode;
                      }

                      JSObject result = new JSObject();
                      result.put("versionCode", versionCode);
                      call.resolve(result);

                  } catch (Exception e) {
                      call.reject(
                          "Impossible de lire la version Android", e
                      );
                  }
              }

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {
                  String apkUrl = call.getString("url");

                  if (apkUrl == null || apkUrl.trim().isEmpty()) {
                      call.reject("URL APK manquante");
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          URL url = new URL(apkUrl);
                          HttpURLConnection connection =
                              (HttpURLConnection) url.openConnection();

                          connection.setConnectTimeout(15000);
                          connection.setReadTimeout(120000);
                          connection.setInstanceFollowRedirects(true);
                          connection.connect();

                          int response = connection.getResponseCode();

                          if (response < 200 || response >= 400) {
                              throw new Exception("HTTP " + response);
                          }

                          File apkFile = new File(
                              getContext().getCacheDir(),
                              "ugtm-update.apk"
                          );

                          try (
                              InputStream input = connection.getInputStream();
                              FileOutputStream output =
                                  new FileOutputStream(apkFile)
                          ) {
                              byte[] buffer = new byte[8192];
                              int count;

                              while ((count = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, count);
                              }
                          }

                          connection.disconnect();

                          getActivity().runOnUiThread(() -> {
                              try {
                                  Uri apkUri = FileProvider.getUriForFile(
                                      getContext(),
                                      getContext().getPackageName()
                                          + ".fileprovider",
                                      apkFile
                                  );

                                  if (Build.VERSION.SDK_INT >=
                                      Build.VERSION_CODES.O &&
                                      !getContext()
                                          .getPackageManager()
                                          .canRequestPackageInstalls()) {

                                      Intent settings = new Intent(
                                          Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          Uri.parse(
                                              "package:" +
                                              getContext().getPackageName()
                                          )
                                      );

                                      getActivity().startActivity(settings);
                                      call.resolve();
                                      return;
                                  }

                                  Intent intent =
                                      new Intent(Intent.ACTION_VIEW);

                                  intent.setDataAndType(
                                      apkUri,
                                      "application/vnd.android.package-archive"
                                  );

                                  intent.addFlags(
                                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                                  );

                                  intent.addFlags(
                                      Intent.FLAG_ACTIVITY_NEW_TASK
                                  );

                                  getActivity().startActivity(intent);
                                  call.resolve();

                              } catch (Exception e) {
                                  call.reject(
                                      "Impossible d'ouvrir l'installation",
                                      e
                                  );
                              }
                          });

                      } catch (Exception e) {
                          getActivity().runOnUiThread(() ->
                              call.reject(
                                  "Téléchargement de la mise à jour impossible",
                                  e
                              )
                          );
                      }
                  });
              }
          }
          JAVA

          python3 - <<'PY2'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/ma/ugtm/souss/massa/MainActivity.java"
          )

          p.write_text("""package ma.ugtm.souss.massa;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(AppUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """)
          PY2

          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          )

          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace(
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  + permission
              )

          p.write_text(text)
          PY2

          echo "Module AppUpdater installé."

      # ==========================================================
      # VERSION ANDROID
      # ==========================================================

      - name: Définir la version Android
        run: |
          set -e

          python3 - <<'PY2'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text, n1 = re.subn(
              r'(?m)^\s*versionCode\s+\d+',
              '        versionCode 3',
              text,
              count=1
          )

          text, n2 = re.subn(
              r'(?m)^\s*versionName\s+"[^"]+"',
              '        versionName "1.2"',
              text,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"ERREUR version Android : versionCode={n1}, versionName={n2}"
              )

          p.write_text(text)

          print("Version Android définie : versionCode 3 / versionName 1.2")
          PY2

          grep -n "versionCode\|versionName" android/app/build.gradle

      # ==========================================================
      # INSTALLATION DU KEYSTORE
      # ==========================================================

      - name: Installer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERREUR : ANDROID_KEYSTORE_BASE64 est absent."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/ugtm-release.keystore

          if [ ! -s android/ugtm-release.keystore ]; then
            echo "ERREUR : keystore vide ou invalide."
            exit 1
          fi

          echo "Keystore installé."

          ls -lh android/ugtm-release.keystore

      # ==========================================================
      # VERIFICATION KEYSTORE
      # ==========================================================

      - name: Vérifier le keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          echo "=== FICHIER KEYSTORE ==="

          ls -lh android/ugtm-release.keystore

          echo ""
          echo "=== VERIFICATION KEYSTORE ==="

          keytool -list \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          echo ""
          echo "Keystore valide."

          echo ""
          echo "=== EMPREINTES ==="

          keytool -list \
            -v \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E "Alias name:|SHA1:|SHA256:"

      # ==========================================================
      # CONFIGURATION SIGNATURE GRADLE
      # ==========================================================

      - name: Configurer la signature Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # ------------------------------------------------------
          # Supprimer une ancienne configuration signingConfigs
          # ------------------------------------------------------

          start = text.find("signingConfigs {")

          if start != -1:
              depth = 0
              end = None

              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  text = text[:start] + text[end:]

          # ------------------------------------------------------
          # Ajouter la configuration PKCS12
          # ------------------------------------------------------

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          marker = "android {"

          if marker not in text:
              raise SystemExit(
                  "ERREUR : bloc android introuvable."
              )

          text = text.replace(
              marker,
              marker + signing,
              1
          )

          # ------------------------------------------------------
          # Vérifier buildTypes
          # ------------------------------------------------------

          if "buildTypes {" in text:

              if "signingConfig signingConfigs.release" not in text:

                  marker = "buildTypes {"

                  replacement = """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  """

                  text = text.replace(
                      marker,
                      replacement,
                      1
                  )

          else:

              text += """

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """

          gradle.write_text(text)
          PY

          echo "Signature Gradle configurée."

      # ==========================================================
      # AFFICHER CONFIGURATION
      # ==========================================================

      - name: Vérifier configuration Gradle
        run: |
          echo "======================================"
          echo "SIGNING CONFIG"
          echo "======================================"

          grep -n -A15 -B3 \
            "signingConfigs" \
            android/app/build.gradle || true

          echo ""
          echo "======================================"
          echo "BUILD TYPES"
          echo "======================================"

          grep -n -A15 \
            "buildTypes" \
            android/app/build.gradle || true

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Compiler APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          echo "Nettoyage Gradle..."
          ./gradlew clean

          echo "Compilation APK Release..."
          ./gradlew assembleRelease

      # ==========================================================
      # VERIFICATION APK
      # ==========================================================

      - name: Vérifier APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK GENEREE"
          echo "======================================"

          ls -lh "$APK"

          echo ""
          echo "======================================"
          echo "SIGNATURE APK"
          echo "======================================"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
