name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier le projet
        run: |
          set -e

          echo "Contenu du projet :"
          ls -la

          if [ ! -f package.json ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          if [ ! -d www ]; then
            echo "ERREUR : dossier www introuvable."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERREUR : capacitor.config.json introuvable."
            exit 1
          fi

          echo "Projet UGTM valide."

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: |
          npm install

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      - name: Installer Capacitor Android
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Générer Android
        run: |
          npx cap add android

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : le secret GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              text = (
                  "buildscript {\n"
                  "    dependencies {\n"
                  "        classpath 'com.google.gms:google-services:4.4.2'\n"
                  "    }\n"
                  "}\n\n"
                  + text
              )
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\n\napply plugin: 'com.google.gms.google-services'\n"

          app.write_text(text)
          PY

          echo "Google Services configuré."

      - name: Synchroniser Capacitor
        run: |
          npx cap sync android

      - name: Configurer le debug keystore
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"
          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo ""
          echo "=========================================="
          echo "SHA-1 DU DEBUG KEYSTORE"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA-1:" || true

          echo ""
          echo "=========================================="
          echo "SHA-256 DU DEBUG KEYSTORE"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|SHA-256:" || true

      - name: Forcer la signature debug
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          if "signingConfigs" not in text:
              marker = "android {"

              signing = """
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              """

              if marker in text:
                  text = text.replace(marker, marker + "\n" + signing, 1)

          if "signingConfig signingConfigs.debug" not in text:
              marker = "buildTypes {"

              replacement = """buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
          """

              if marker in text:
                  text = text.replace(marker, replacement, 1)

          gradle.write_text(text)
          PY

          echo "Configuration de signature :"
          grep -n -A15 -B3 "signingConfigs" app/build.gradle || true

      - name: Compiler APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleDebug

      - name: Vérifier APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          ls -lh "$APK"

          echo ""
          echo "=========================================="
          echo "CERTIFICAT REEL DE L'APK"
          echo "=========================================="

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify \
            --print-certs \
            "$APK"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
