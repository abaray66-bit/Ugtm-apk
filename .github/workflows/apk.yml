name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier le projet
        run: |
          set -e
          test -f package.json || { echo "ERREUR : package.json introuvable."; exit 1; }
          test -d www || { echo "ERREUR : dossier www introuvable."; exit 1; }
          test -f capacitor.config.json || { echo "ERREUR : capacitor.config.json introuvable."; exit 1; }
          echo "Projet UGTM valide."

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: |
          set -e
          npm install
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier Capacitor
        run: npx cap --version

      - name: Générer le projet Android
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  text = (
                      "buildscript {\n"
                      "    dependencies {\n"
                      "        classpath 'com.google.gms:google-services:4.4.2'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

                  root.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "com.google.gms.google-services" not in text:
                  text += "\n\napply plugin: 'com.google.gms.google-services'\n"
                  app.write_text(text)
          PY

      - name: Installer les icônes UGTM
        run: |
          set -e

          if [ ! -d android-icons ]; then
            echo "ERREUR : dossier android-icons introuvable."
            exit 1
          fi

          RES="android/app/src/main/res"

          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$dens"
            cp "android-icons/mipmap-$dens/"*.png "$RES/mipmap-$dens/"
          done

          VALUES="$RES/values"
          mkdir -p "$VALUES"
          cp android-icons/ic_launcher_background.xml "$VALUES/"

          echo "Icônes UGTM installées."

      - name: Synchroniser Capacitor
        run: |
          set -e
          npx cap sync android

      - name: Compiler APK Debug
        working-directory: android
        run: |
          set -e

          chmod +x gradlew

          echo "Nettoyage Gradle..."
          ./gradlew clean

          echo "Compilation APK Debug..."
          ./gradlew assembleDebug

      - name: Vérifier APK Debug
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK debug introuvable."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK DEBUG GENERE"
          echo "======================================"

          ls -lh "$APK"

          echo "======================================"
          echo "VERIFICATION SIGNATURE"
          echo "======================================"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Publier APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
