name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trouver et extraire le ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Archive trouvée : $ZIP"
            mkdir -p app
            unzip -o "$ZIP" -d app
            TARGET_DIR="app"
          else
            PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)

            if [ -z "$PKG_PATH" ]; then
              TARGET_DIR="."
            else
              TARGET_DIR=$(dirname "$PKG_PATH")
            fi
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "Projet : $TARGET_DIR"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier capacitor.config.json
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          if [ -f capacitor.config.json ]; then
            echo "Configuration existante :"
            cat capacitor.config.json
          else
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "ma.ugtm.souss.massa",
            "appName": "UGTM Souss-Massa",
            "webDir": "www"
          }
          EOF
          fi

      - name: Générer Android
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Installer google-services.json depuis GitHub Secret
        working-directory: ${{ env.TARGET_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : le secret GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              text = (
                  "buildscript {\n"
                  "    dependencies {\n"
                  "        classpath 'com.google.gms:google-services:4.4.2'\n"
                  "    }\n"
                  "}\n\n"
                  + text
              )
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\n\napply plugin: 'com.google.gms.google-services'\n"

          app.write_text(text)
          PY

      - name: Synchroniser Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap sync android

      - name: Créer le debug keystore et afficher SHA
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew

          KEYSTORE="$HOME/.config/.android/debug.keystore"

          mkdir -p "$HOME/.config/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo ""
          echo "=========================================="
          echo "SHA-1 DU CERTIFICAT ANDROID"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey | grep -E "SHA1:|SHA-1:" || true

          echo ""
          echo "=========================================="
          echo "SHA-256 DU CERTIFICAT ANDROID"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey | grep -E "SHA256:|SHA-256:" || true

      - name: Compiler APK
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Vérifier APK
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: ${{ env.TARGET_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
