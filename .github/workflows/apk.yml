name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # VERIFICATION PROJET
      # ==========================================================

      - name: Vérifier le projet
        run: |
          set -e

          echo "=== CONTENU DU PROJET ==="
          ls -la

          if [ ! -f package.json ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          if [ ! -d www ]; then
            echo "ERREUR : dossier www introuvable."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERREUR : capacitor.config.json introuvable."
            exit 1
          fi

          echo "Projet UGTM valide."

      # ==========================================================
      # NODE
      # ==========================================================

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Syntaxe JS + JSON : bloque l'APK si un fichier est cassé.
      - name: Vérifier la syntaxe JavaScript
        run: node tools/check-syntax.js

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================================
      # DEPENDANCES
      # ==========================================================

      - name: Installer les dépendances
        run: |
          set -e
          npm install

      - name: Installer Capacitor Android
        run: |
          set -e
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      # ==========================================================
      # PROJET ANDROID
      # ==========================================================

      - name: Générer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Projet Android absent : génération..."
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      # ==========================================================
      # FIREBASE
      # ==========================================================

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          echo "google-services.json installé."

      # ==========================================================
      # GOOGLE SERVICES GRADLE
      # ==========================================================

      - name: Configurer Google Services Gradle
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  text = (
                      "buildscript {\n"
                      "    dependencies {\n"
                      "        classpath "
                      "'com.google.gms:google-services:4.4.2'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

                  root.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "com.google.gms.google-services" not in text:
                  text += (
                      "\n\n"
                      "apply plugin: 'com.google.gms.google-services'\n"
                  )

              app.write_text(text)
          PY

      # ==========================================================
      # ICÔNES UGTM (lanceur Android)
      # ==========================================================

      - name: Installer les icônes UGTM
        run: |
          set -e

          if [ ! -d android-icons ]; then
            echo "ERREUR : dossier android-icons introuvable."
            exit 1
          fi

          RES="android/app/src/main/res"

          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$dens"
            cp "android-icons/mipmap-$dens/"*.png "$RES/mipmap-$dens/"
          done

          # Fond de l'icône adaptative (blanc)
          VALUES="android/app/src/main/res/values"
          mkdir -p "$VALUES"
          cp android-icons/ic_launcher_background.xml "$VALUES/"

          echo "Icônes UGTM installées :"
          ls "$RES"/mipmap-*/ic_launcher.png

      # ==========================================================
      # VERSION OTA + MANIFESTE EMBARQUÉ
      # Le manifeste embarqué dans l'APK doit porter la version
      # installée (versionCode == versionName), sinon l'app
      # compare en boucle le manifeste distant au manifeste
      # embarqué et affiche indéfiniment « mise à jour disponible »
      # (10545 > 10544). L'empreinte SHA-256 définitive est
      # injectée après le build par l'étape « Publication OTA
      # automatique (update.json) », qui publie le même fichier.
      # ==========================================================

      - name: Préparer le manifeste OTA embarqué
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          version = json.loads(
              Path("package.json").read_text(encoding="utf-8")
          )["version"].strip()

          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not m:
              raise SystemExit(f"Version invalide : {version}")

          major, minor, patch = (int(g) for g in m.groups())
          version_code = major * 10000 + minor * 100 + patch

          repository = os.environ.get(
              "GITHUB_REPOSITORY", "abaray66-bit/Ugtm-apk"
          )

          apk_url = (
              f"https://github.com/{repository}/releases/download/"
              f"v{version}/app-release.apk"
          )

          manifest = {
              "versionCode": version_code,
              "versionName": version,
              "apkUrl": apk_url,
              "sha256": "",
              "message": (
                  "Une nouvelle version de l'application UGTM "
                  "Souss-Massa est disponible."
              ),
          }

          assert manifest["versionCode"] > 0
          assert manifest["versionName"]
          assert manifest["apkUrl"].startswith("https://")

          path = Path("www/update.json")
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          checked = json.loads(path.read_text(encoding="utf-8"))
          assert checked == manifest

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"UGTM_VERSION={version}\n")
              env.write(f"UGTM_VERSION_CODE={version_code}\n")
              env.write(f"UGTM_VERSION_NAME={version}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(
                      f"Manifeste OTA embarqué : versionCode {version_code}"
                      f" / versionName \"{version}\"\n"
                  )

          print("Manifeste OTA embarqué :")
          print(json.dumps(checked, indent=2, ensure_ascii=False))
          PY

      # ==========================================================
      # CAPACITOR SYNC
      # ==========================================================

      - name: Synchroniser Capacitor
        run: |
          set -e
          npx cap sync android

      # ==========================================================
      # ==========================================================
      # SYSTEME NATIF DE MISE A JOUR AUTOMATIQUE
      # ==========================================================

      - name: Installer le système natif de mise à jour
        run: |
          set -e

          JAVA_DIR="android/app/src/main/java/ma/ugtm/souss/massa"
          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/UpdateManager.java" <<'JAVA'
          package ma.ugtm.souss.massa;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public final class UpdateManager {

              private static final String UPDATE_URL =
                  "https://ugtm-fns-souss-massa.web.app/update.json";

              private static final String APK_NAME =
                  "ugtm-update.apk";

              private static final ExecutorService EXECUTOR =
                  Executors.newSingleThreadExecutor();

              private UpdateManager() {}

              public static void check(Context context) {
                  Context appContext = context.getApplicationContext();

                  EXECUTOR.execute(() -> {
                      try {
                          checkInternal(appContext);
                      } catch (Exception e) {
                          android.util.Log.e(
                              "UGTM_UPDATE",
                              "Vérification mise à jour échouée",
                              e
                          );
                      }
                  });
              }

              private static void checkInternal(Context context)
                      throws Exception {

                  long currentVersionCode = getCurrentVersionCode(context);

                  URL url = new URL(
                      UPDATE_URL + "?t=" + System.currentTimeMillis()
                  );

                  HttpURLConnection connection =
                      (HttpURLConnection) url.openConnection();

                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(30000);
                  connection.setUseCaches(false);
                  connection.setRequestProperty(
                      "Cache-Control",
                      "no-cache"
                  );
                  connection.setRequestProperty(
                      "Pragma",
                      "no-cache"
                  );
                  connection.setInstanceFollowRedirects(true);

                  try {
                      connection.connect();

                      int response =
                          connection.getResponseCode();

                      if (response < 200 || response >= 300) {
                          throw new Exception(
                              "HTTP " + response
                          );
                      }

                      String json;

                      try (InputStream input =
                               connection.getInputStream()) {

                          java.io.ByteArrayOutputStream buffer =
                              new java.io.ByteArrayOutputStream();

                          byte[] data = new byte[4096];
                          int count;

                          while ((count = input.read(data)) != -1) {
                              buffer.write(data, 0, count);
                          }

                          json = buffer.toString("UTF-8");
                      }

                      JSONObject update =
                          new JSONObject(json);

                      long remoteVersionCode =
                          update.getLong("versionCode");

                      String apkUrl =
                          update.getString("apkUrl");

                      android.util.Log.i(
                          "UGTM_UPDATE",
                          "Version actuelle=" +
                          currentVersionCode +
                          " version serveur=" +
                          remoteVersionCode
                      );

                      if (remoteVersionCode <= currentVersionCode) {
                          android.util.Log.i(
                              "UGTM_UPDATE",
                              "Application déjà à jour."
                          );
                          return;
                      }

                      String sha256 = update.optString("sha256", "").trim();

                      File apkFile = downloadApk(context, apkUrl);

                      // Vérifier l'empreinte lorsqu'elle est publiée.
                      // Un manifeste sans SHA reste compatible avec l'existant.
                      if (!sha256.isEmpty()) {
                          if (!sha256.matches("(?i)[0-9a-f]{64}")) {
                              apkFile.delete();
                              throw new Exception("SHA-256 absent ou invalide");
                          }

                          String calculated = sha256(apkFile);
                          if (!calculated.equalsIgnoreCase(sha256)) {
                              apkFile.delete();
                              throw new Exception("SHA-256 APK invalide");
                          }
                      }

                      launchInstaller(context, apkFile);

                  } finally {
                      connection.disconnect();
                  }
              }

              private static long getCurrentVersionCode(
                      Context context) throws Exception {

                  PackageManager pm =
                      context.getPackageManager();

                  PackageInfo info =
                      pm.getPackageInfo(
                          context.getPackageName(),
                          0
                      );

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.P) {

                      return info.getLongVersionCode();

                  } else {
                      return info.versionCode;
                  }
              }

              private static File downloadApk(
                      Context context,
                      String apkUrl
              ) throws Exception {

                  URL url = new URL(apkUrl);

                  HttpURLConnection connection =
                      (HttpURLConnection) url.openConnection();

                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(120000);
                  connection.setInstanceFollowRedirects(true);
                  connection.connect();

                  try {
                      int response =
                          connection.getResponseCode();

                      if (response < 200 || response >= 300) {
                          throw new Exception(
                              "Téléchargement HTTP " + response
                          );
                      }

                      File apkFile =
                          new File(
                              context.getCacheDir(),
                              APK_NAME
                          );

                      try (
                          InputStream input =
                              connection.getInputStream();

                          FileOutputStream output =
                              new FileOutputStream(apkFile)
                      ) {
                          byte[] buffer =
                              new byte[8192];

                          int count;

                          while ((count =
                                  input.read(buffer)) != -1) {

                              output.write(
                                  buffer,
                                  0,
                                  count
                              );
                          }

                          output.flush();
                      }

                      if (!apkFile.exists() ||
                          apkFile.length() < 1024) {

                          throw new Exception(
                              "APK téléchargé invalide"
                          );
                      }

                      return apkFile;

                  } finally {
                      connection.disconnect();
                  }
              }

              private static String sha256(
                      File file
              ) throws Exception {

                  MessageDigest digest =
                      MessageDigest.getInstance("SHA-256");

                  try (InputStream input =
                           new FileInputStream(file)) {

                      byte[] buffer =
                          new byte[8192];

                      int count;

                      while ((count =
                              input.read(buffer)) != -1) {

                          digest.update(
                              buffer,
                              0,
                              count
                          );
                      }
                  }

                  byte[] hash =
                      digest.digest();

                  StringBuilder result =
                      new StringBuilder();

                  for (byte b : hash) {
                      result.append(
                          String.format(
                              "%02x",
                              b & 0xff
                          )
                      );
                  }

                  return result.toString();
              }

              private static void launchInstaller(
                      Context context,
                      File apkFile
              ) {

                  android.os.Handler handler =
                      new android.os.Handler(
                          context.getMainLooper()
                      );

                  handler.post(() -> {

                      try {

                          if (Build.VERSION.SDK_INT >=
                              Build.VERSION_CODES.O) {

                              boolean allowed =
                                  context
                                      .getPackageManager()
                                      .canRequestPackageInstalls();

                              if (!allowed) {

                                  Intent settings =
                                      new Intent(
                                          Settings
                                              .ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          Uri.parse(
                                              "package:" +
                                              context.getPackageName()
                                          )
                                      );

                                  settings.addFlags(
                                      Intent.FLAG_ACTIVITY_NEW_TASK
                                  );

                                  context.startActivity(settings);
                                  return;
                              }
                          }

                          Uri apkUri =
                              FileProvider.getUriForFile(
                                  context,
                                  context.getPackageName() +
                                      ".fileprovider",
                                  apkFile
                              );

                          Intent installer =
                              new Intent(
                                  Intent.ACTION_VIEW
                              );

                          installer.setDataAndType(
                              apkUri,
                              "application/vnd.android.package-archive"
                          );

                          installer.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );

                          installer.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          );

                          context.startActivity(installer);

                      } catch (Exception e) {

                          android.util.Log.e(
                              "UGTM_UPDATE",
                              "Impossible de lancer l'installation",
                              e
                          );
                      }
                  });
              }
          }
          JAVA

          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package ma.ugtm.souss.massa;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  UpdateManager.check(this);
              }
          }
          JAVA

          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          )

          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace(
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  + permission
              )

          p.write_text(text)
          PY2

          echo "Système natif de mise à jour installé."

      - name: Définir la version Android
        run: |
          set -e

          # Source unique de version : package.json (versionName).
          # versionCode dérivé : major*10000 + minor*100 + patch
          # (1.4.0 → 10400), croissant à chaque publication semver.
          # Penser à reporter versionCode / versionName dans www/update.json
          # à la publication de la mise à jour OTA.

          python3 - <<'PY2'
          from pathlib import Path
          import json
          import os
          import re

          pkg = json.loads(Path("package.json").read_text())
          version = str(pkg.get("version", "")).strip()

          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)

          if not m:
              raise SystemExit(
                  f"ERREUR version : package.json doit porter une version "
                  f"semver X.Y.Z (trouvé : {version!r})."
              )

          major, minor, patch = (int(g) for g in m.groups())
          version_code = major * 10000 + minor * 100 + patch
          version_name = version

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text, n1 = re.subn(
              r'(?m)^\s*versionCode\s+\d+',
              f'        versionCode {version_code}',
              text,
              count=1
          )

          text, n2 = re.subn(
              r'(?m)^\s*versionName\s+"[^"]+"',
              f'        versionName "{version_name}"',
              text,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  f"ERREUR version Android : versionCode={n1}, versionName={n2}"
              )

          p.write_text(text)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary:
              with open(summary, "a") as f:
                  f.write(
                      f"Version Android : versionCode {version_code} / "
                      f"versionName \"{version_name}\" "
                      f"(depuis package.json {version})\n"
                  )

          print(
              f"Version Android définie : versionCode {version_code} / "
              f"versionName \"{version_name}\""
          )
          PY2

          grep -n "versionCode\|versionName" android/app/build.gradle

      # ==========================================================
      # INSTALLATION DU KEYSTORE
      # ==========================================================

      - name: Installer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERREUR : ANDROID_KEYSTORE_BASE64 est absent."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/ugtm-release.keystore

          if [ ! -s android/ugtm-release.keystore ]; then
            echo "ERREUR : keystore vide ou invalide."
            exit 1
          fi

          echo "Keystore installé."

          ls -lh android/ugtm-release.keystore

      # ==========================================================
      # VERIFICATION KEYSTORE
      # ==========================================================

      - name: Vérifier le keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          echo "=== FICHIER KEYSTORE ==="

          ls -lh android/ugtm-release.keystore

          echo ""
          echo "=== VERIFICATION KEYSTORE ==="

          keytool -list \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          echo ""
          echo "Keystore valide."

          echo ""
          echo "=== EMPREINTES ==="

          keytool -list \
            -v \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E "Alias name:|SHA1:|SHA256:"

      # ==========================================================
      # CONFIGURATION SIGNATURE GRADLE
      # ==========================================================

      - name: Configurer la signature Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # ------------------------------------------------------
          # Supprimer une ancienne configuration signingConfigs
          # ------------------------------------------------------

          start = text.find("signingConfigs {")

          if start != -1:
              depth = 0
              end = None

              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  text = text[:start] + text[end:]

          # ------------------------------------------------------
          # Ajouter la configuration PKCS12
          # ------------------------------------------------------

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          marker = "android {"

          if marker not in text:
              raise SystemExit(
                  "ERREUR : bloc android introuvable."
              )

          text = text.replace(
              marker,
              marker + signing,
              1
          )

          # ------------------------------------------------------
          # Vérifier buildTypes
          # ------------------------------------------------------

          if "buildTypes {" in text:

              if "signingConfig signingConfigs.release" not in text:

                  marker = "buildTypes {"

                  replacement = """buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  """

                  text = text.replace(
                      marker,
                      replacement,
                      1
                  )

          else:

              text += """

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """

          gradle.write_text(text)
          PY

          echo "Signature Gradle configurée."

      # ==========================================================
      # AFFICHER CONFIGURATION
      # ==========================================================

      - name: Vérifier configuration Gradle
        run: |
          echo "======================================"
          echo "SIGNING CONFIG"
          echo "======================================"

          grep -n -A15 -B3 \
            "signingConfigs" \
            android/app/build.gradle || true

          echo ""
          echo "======================================"
          echo "BUILD TYPES"
          echo "======================================"

          grep -n -A15 \
            "buildTypes" \
            android/app/build.gradle || true

      # ==========================================================
      # BUILD APK
      # ==========================================================

      - name: Compiler APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          echo "Nettoyage Gradle..."
          ./gradlew clean

          echo "Compilation APK Release..."
          ./gradlew assembleRelease

      # ==========================================================
      # VERIFICATION APK
      # ==========================================================

      - name: Vérifier APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."

            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK GENEREE"
          echo "======================================"

          ls -lh "$APK"

          echo ""
          echo "======================================"
          echo "SIGNATURE APK"
          echo "======================================"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Calculer SHA-256 de l'APK
        shell: bash
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          HASH="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" "app-release.apk" > "$APK.sha256"
          echo "SHA-256 APK : $HASH" >> "$GITHUB_STEP_SUMMARY"
          echo "Empreinte à reporter dans www/update.json avant publication de la mise à jour."

      # ==========================================================
      # ARTIFACT
      # ==========================================================

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error

      # ==========================================================
      # RELEASE GitHub (l'APK de update.json y est attaché)
      # Une release existante n'est pas recréée : l'APK publié
      # reste celui dont l'empreinte est enregistrée dans
      # update.json (les reconstructions ne sont pas identiques
      # à l'octet près → recréer la release casserait la
      # vérification SHA-256 côté appareil).
      # ==========================================================

      - name: Vérifier si la release existe
        id: release_check
        run: |
          set -e

          if gh release view "v${UGTM_VERSION_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${UGTM_VERSION_NAME} déjà existante — APK conservé."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v${UGTM_VERSION_NAME} à créer."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # ==========================================================
      # CRÉER LA RELEASE GITHUB
      # softprops/action-gh-release gère les releases existantes
      # (écrase l'asset si déjà présent) → pas besoin de condition.
      # ==========================================================

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.UGTM_VERSION_NAME }}
          name: UGTM Souss-Massa ${{ env.UGTM_VERSION_NAME }}
          files: android/app/build/outputs/apk/release/app-release.apk
          token: ${{ github.token }}
          draft: false
          prerelease: false

      # ==========================================================
      # PUBLICATION OTA AUTOMATIQUE
      # Régénère www/update.json (versionCode, versionName, apkUrl,
      # sha256) et le pousse sur main : update.json est déployé
      # automatiquement par le workflow Firebase Hosting. La
      # boucle s'arrête d'elle-même : à la publication suivante,
      # update.json régénéré est identique → aucun commit.
      # ==========================================================

      - name: Publication OTA automatique (update.json)
        run: |
          set -euo pipefail

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERREUR : APK absent ou vide."
            exit 1
          fi

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${UGTM_VERSION_NAME}/app-release.apk"

          # Empreinte de l'APK réellement publié dans la release :
          # on le télécharge depuis l'URL de la release (identique à l'APK
          # construit si la release vient d'être créée, ou à l'APK existant
          # si la release préexiste — les reconstructions ne sont pas
          # reproductibles à l'octet près).
          rm -rf /tmp/ugtm-ota
          mkdir -p /tmp/ugtm-ota
          if ! curl -sSL --fail --connect-timeout 20 --max-time 300 "$APK_URL" -o /tmp/ugtm-ota/app-release.apk || [ ! -s /tmp/ugtm-ota/app-release.apk ]; then
            echo "Téléchargement de la release impossible — empreinte de l'APK construit utilisée."
            cp "$APK_PATH" /tmp/ugtm-ota/app-release.apk
          fi
          RELEASE_SHA256="$(sha256sum /tmp/ugtm-ota/app-release.apk | awk '{print $1}')"
          RELEASE_SIZE="$(wc -c < /tmp/ugtm-ota/app-release.apk | tr -d ' ')"

          export APK_URL RELEASE_SHA256 RELEASE_SIZE

          # Vérifier versionCode ET sha256 distants AVANT d'écrire localement.
          # Si la version distante est déjà correcte, ne rien faire.
          REMOTE_MANIFEST="$(git ls-remote origin refs/heads/${GITHUB_REF_NAME} | awk '{print $1}' | xargs -I {} git show {}:www/update.json 2>/dev/null || echo '')"
          if [ -n "$REMOTE_MANIFEST" ]; then
            CURRENT_REMOTE_CODE="$(echo "$REMOTE_MANIFEST" | python3 -c "import json,sys;print(json.load(sys.stdin)['versionCode'])" 2>/dev/null || echo 0)"
            CURRENT_REMOTE_SHA="$(echo "$REMOTE_MANIFEST" | python3 -c "import json,sys;print(json.load(sys.stdin)['sha256'])" 2>/dev/null || echo '')"
            if [ "$CURRENT_REMOTE_CODE" = "$UGTM_VERSION_CODE" ] && [ "$CURRENT_REMOTE_SHA" = "$RELEASE_SHA256" ]; then
              echo "update.json distant déjà à jour (versionCode ${CURRENT_REMOTE_CODE}, sha256 ${CURRENT_REMOTE_SHA}) — rien à publier."
              exit 0
            elif [ "$CURRENT_REMOTE_CODE" = "$UGTM_VERSION_CODE" ]; then
              echo "versionCode identique mais sha256 diffère (distant: ${CURRENT_REMOTE_SHA}, release: ${RELEASE_SHA256}) — mise à jour nécessaire."
            fi
          else
            CURRENT_REMOTE_CODE="0"
            CURRENT_REMOTE_SHA=""
          fi

          # Écrire le manifeste local seulement si une mise à jour est nécessaire.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "versionCode": int(os.environ["UGTM_VERSION_CODE"]),
              "versionName": os.environ["UGTM_VERSION_NAME"],
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["RELEASE_SHA256"].strip().lower(),
              "message": "Une nouvelle version de l'application UGTM Souss-Massa est disponible."
          }

          assert len(manifest["sha256"]) == 64
          assert manifest["versionCode"] > 0
          assert manifest["versionName"]
          assert manifest["apkUrl"].startswith("https://")

          path = Path("www/update.json")
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          checked = json.loads(path.read_text(encoding="utf-8"))
          assert checked == manifest

          print("Manifeste OTA validé :")
          print(json.dumps(checked, indent=2, ensure_ascii=False))
          print("Taille APK release :", os.environ["RELEASE_SIZE"], "octets")
          PY

          echo "SHA-256 de l'APK release : $RELEASE_SHA256"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Committer le nouveau manifeste AVANT toute opération distante :
          # un `git pull --rebase` exige un arbre de travail propre.
          if git diff --quiet -- www/update.json; then
            echo "update.json local identique à la version extraite — aucun commit."
          else
            git add www/update.json
            git commit -m "Mise à jour OTA automatique : v${UGTM_VERSION_NAME} (versionCode ${UGTM_VERSION_CODE})"
          fi

          # Pousser ; en cas de rejet (push concurrent), récupérer puis rebaser
          # en gardant notre manifeste (le plus récent), puis repousser.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejeté — récupération de l'état distant et rebase."
            git fetch origin "${GITHUB_REF_NAME}"
            # Stash any unstaged changes (e.g., version bump in build.gradle) before rebase
            git stash push -u -m "OTA workflow stash before rebase"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            git stash pop || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # Déclencher explicitement le déploiement Firebase Hosting pour mettre
          # update.json en ligne immédiatement. Le workflow Hosting écoute
          # workflow_dispatch ; sans ce déclenchement, le site continuerait à
          # servir l'ancien manifeste (bug connu : v1.5.3/10503 jamais déployé).
          OTA_SHA="$(git rev-parse HEAD)"
          gh workflow run "Deploy Firebase Hosting" \
            --ref "${GITHUB_REF_NAME}"

          # Attendre que le déploiement déclenché porte bien le commit OTA,
          # puis surveiller sa réussite : sans cette vérification, le site
          # peut continuer à servir l'ancien manifeste.
          DEPLOY_RUN_ID=""
          for _ in $(seq 1 30); do
            DEPLOY_RUN_ID="$(gh run list \
              --workflow "Deploy Firebase Hosting" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${OTA_SHA}\") | .databaseId" \
              | head -n 1)"
            if [ -n "$DEPLOY_RUN_ID" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$DEPLOY_RUN_ID" ]; then
            echo "ERREUR : aucun déploiement Firebase Hosting déclenché pour le commit ${OTA_SHA}."
            exit 1
          fi

          gh run watch "$DEPLOY_RUN_ID" --exit-status
          echo "Firebase Hosting déployé pour le commit ${OTA_SHA} : update.json v${UGTM_VERSION_NAME} (versionCode ${UGTM_VERSION_CODE}) est en ligne."
        env:
          GH_TOKEN: ${{ github.token }}
