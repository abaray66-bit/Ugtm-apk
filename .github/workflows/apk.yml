name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier le projet
        run: |
          set -e

          echo "=== Contenu du projet ==="
          ls -la

          if [ ! -f package.json ]; then
            echo "ERREUR : package.json introuvable."
            exit 1
          fi

          if [ ! -d www ]; then
            echo "ERREUR : dossier www introuvable."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERREUR : capacitor.config.json introuvable."
            exit 1
          fi

          echo "Projet UGTM valide."

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Capacitor Android
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier Capacitor
        run: npx cap --version

      - name: Générer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      - name: Installer google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERREUR : GOOGLE_SERVICES_JSON est absent."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  text = (
                      "buildscript {\n"
                      "    dependencies {\n"
                      "        classpath 'com.google.gms:google-services:4.4.2'\n"
                      "    }\n"
                      "}\n\n"
                      + text
                  )

                  root.write_text(text)

          app = Path("android/app/build.gradle")

          if app.exists():
              text = app.read_text()

              if "com.google.gms.google-services" not in text:
                  text += "\n\napply plugin: 'com.google.gms.google-services'\n"

              app.write_text(text)
          PY

      - name: Synchroniser Capacitor
        run: |
          set -e
          npx cap sync android

      # ==========================================================
      # KEystore DE SIGNATURE STABLE
      # ==========================================================

      - name: Installer le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERREUR : ANDROID_KEYSTORE_BASE64 est absent."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/ugtm-release.keystore

          if [ ! -s android/ugtm-release.keystore ]; then
            echo "ERREUR : keystore vide ou invalide."
            exit 1
          fi

          echo "Keystore installé."

      - name: Vérifier le keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -v \
            -keystore android/ugtm-release.keystore \
            -storetype PKCS12 \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Configurer la signature Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # Retirer d'anciennes configurations de signature
          # ajoutées par d'anciens workflows.
          start = text.find("signingConfigs {")

          if start != -1:
              depth = 0
              end = None

              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  text = text[:start] + text[end:]

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          marker = "android {"

          if marker not in text:
              raise SystemExit("ERREUR : bloc android introuvable.")

          text = text.replace(
              marker,
              marker + signing,
              1
          )

          # Supprimer un ancien bloc release s'il existe
          build_marker = "buildTypes {"
          build_start = text.find(build_marker)

          if build_start != -1:
              brace = text.find("{", build_start)
              depth = 0
              end = None

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  old_block = text[build_start:end]

                  release_start = old_block.find("release {")

                  if release_start != -1:
                      release_brace = old_block.find("{", release_start)
                      rdepth = 0
                      release_end = None

                      for i in range(release_brace, len(old_block)):
                          if old_block[i] == "{":
                              rdepth += 1
                          elif old_block[i] == "}":
                              rdepth -= 1
                              if rdepth == 0:
                                  release_end = i + 1
                                  break

                      if release_end:
                          old_block = (
                              old_block[:release_start]
                              + old_block[release_end:]
                          )

                  new_block = old_block.rstrip()

                  if not new_block.endswith("}"):
                      new_block += "\n}"

                  new_block = new_block[:-1] + """
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }"""

                  text = (
                      text[:build_start]
                      + new_block
                      + text[end:]
                  )

          else:
              text += """

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """

          gradle.write_text(text)
          PY

          echo "Configuration de signature terminée."

      - name: Afficher la configuration Gradle
        run: |
          echo "=== SIGNING CONFIG ==="
          grep -n -A15 -B3 "signingConfigs" android/app/build.gradle || true

          echo ""
          echo "=== BUILD TYPES ==="
          grep -n -A15 "buildTypes" android/app/build.gradle || true

      - name: Compiler APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease

      - name: Vérifier APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK introuvable."
            find android/app/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo "APK générée :"
          ls -lh "$APK"

          echo ""
          echo "=== SIGNATURE APK ==="

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
