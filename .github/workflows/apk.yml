name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android si nécessaire
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Ajouter la configuration Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          echo "google-services.json installé."

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Générer l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Vérifier l'APK debug
        run: |
          APK=$(find android/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name "*.apk" -print -quit)
          test -n "$APK" || {
            echo "ERREUR : aucune APK debug trouvée."
            exit 1
          }
          echo "APK générée : $APK"

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
