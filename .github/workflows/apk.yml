name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers du projet
        run: |
          set -e

          echo "=== Structure du projet ==="
          ls -la

          test -f package.json || {
            echo "ERREUR : package.json introuvable"
            exit 1
          }

          test -d www || {
            echo "ERREUR : dossier www introuvable"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERREUR : capacitor.config.json introuvable"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: |
          set -e

          npm install

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/assets@3.0.5

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      - name: Télécharger le logo officiel UGTM
        run: |
          set -e

          mkdir -p resources

          curl -fL --retry 3 \
            "https://ugtm.ma/?wpdmdl=985" \
            -o resources/icon.png

          if [ ! -s resources/icon.png ]; then
            echo "ERREUR : impossible de télécharger le logo UGTM."
            exit 1
          fi

          echo "=== Logo UGTM ==="
          file resources/icon.png
          ls -lh resources/icon.png

      - name: Créer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      - name: Générer les icônes Android
        run: |
          set -e

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"

      - name: Installer Google Services
        run: |
          set -e

          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            mkdir -p android/app

            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' \
              > android/app/google-services.json

            echo "google-services.json installé."
          else
            echo "GOOGLE_SERVICES_JSON non configuré."
          fi

      - name: Configurer Google Services Gradle
        run: |
          set -e

          if [ -f android/app/google-services.json ]; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          if "com.google.gms:google-services" not in s:
              s += """
          buildscript {
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }
          """

          p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s += """
          apply plugin: 'com.google.gms.google-services'
          """

          p.write_text(s)
          PY

          else
            echo "Firebase non configuré, étape ignorée."
          fi

      - name: Synchroniser Capacitor
        run: |
          set -e

          npx cap sync android

      - name: Vérifier le projet Android
        run: |
          set -e

          test -f android/gradlew || {
            echo "ERREUR : android/gradlew introuvable."
            exit 1
          }

          chmod +x android/gradlew

          echo "=== Projet Android ==="
          find android/app/src/main -maxdepth 3 -type f | head -100

      - name: Configurer la signature APK
        run: |
          set -e

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then

            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
              | base64 --decode > android/ugtm-release.keystore

            test -s android/ugtm-release.keystore || {
              echo "ERREUR : keystore invalide."
              exit 1
            }

            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs" not in s:
              marker = "android {"

              signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              """

              s = s.replace(marker, marker + "\n" + signing)

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "buildTypes {",
                  """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  """
              )

          p.write_text(s)
          PY

            echo "Signature release configurée."

          else
            echo "ANDROID_KEYSTORE_BASE64 non configuré."
            echo "L'APK sera construit sans signature personnalisée."
          fi

      - name: Build APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleRelease

      - name: Vérifier APK
        run: |
          set -e

          echo "=== APK générés ==="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -ls

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK Release trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
