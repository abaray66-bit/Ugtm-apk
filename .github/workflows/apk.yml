name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers du projet
        run: |
          set -e

          echo "=== Structure du projet ==="
          ls -la

          test -f package.json || {
            echo "ERREUR : package.json introuvable"
            exit 1
          }

          test -d www || {
            echo "ERREUR : dossier www introuvable"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERREUR : capacitor.config.json introuvable"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: |
          set -e

          npm install

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor/assets@3.0.5

      - name: Vérifier Capacitor
        run: |
          npx cap --version

      - name: Télécharger le logo officiel UGTM
        run: |
          set -e

          mkdir -p resources

          curl -fL --retry 3 \
            "https://ugtm.ma/?wpdmdl=985" \
            -o resources/icon.png

          if [ ! -s resources/icon.png ]; then
            echo "ERREUR : impossible de télécharger le logo UGTM."
            exit 1
          fi

          echo "=== Logo UGTM ==="
          file resources/icon.png
          ls -lh resources/icon.png

      - name: Créer le projet Android
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Projet Android déjà présent."
          fi

      - name: Générer les icônes Android
        run: |
          set -e

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"

      - name: Installer Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Google Services non configuré."
            exit 0
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "google-services.json installé."

      - name: Configurer Google Services Gradle
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Google Services non configuré."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          # Projet Gradle principal
          p = Path("android/build.gradle")
          s = p.read_text()

          if "com.google.gms:google-services" not in s:
              if "buildscript {" in s and "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                      1
                  )
              else:
                  s = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.2'
              }
          }

          """ + s

          p.write_text(s)

          # Module application
          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"

          p.write_text(s)
          PY

      - name: Synchroniser Capacitor
        run: |
          set -e

          npx cap sync android

      - name: Vérifier le projet Android
        run: |
          set -e

          test -f android/gradlew || {
            echo "ERREUR : android/gradlew introuvable."
            exit 1
          }

          chmod +x android/gradlew

          echo "=== android/app/build.gradle ==="
          sed -n '1,120p' android/app/build.gradle

      - name: Préparer la signature APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ERREUR : ANDROID_KEYSTORE_BASE64 est vide."
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "ERREUR : ANDROID_KEYSTORE_PASSWORD est vide."
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "ERREUR : ANDROID_KEY_ALIAS est vide."
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "ERREUR : ANDROID_KEY_PASSWORD est vide."
            exit 1
          }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/ugtm-release.keystore

          test -s android/ugtm-release.keystore || {
            echo "ERREUR : keystore invalide."
            exit 1
          }

          echo "Keystore présent."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Ne jamais créer un deuxième bloc android {.
          # On insère uniquement signingConfigs à l'intérieur
          # du bloc android existant.

          if "signingConfigs {" not in s:

              marker = "android {"

              if marker not in s:
                  raise SystemExit(
                      "ERREUR : bloc android { introuvable."
                  )

              signing = """
              signingConfigs {
                  release {
                      storeFile file("../ugtm-release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              """

              position = s.find(marker) + len(marker)

              s = (
                  s[:position]
                  + signing
                  + s[position:]
              )

          # Cherche le buildTypes release existant.
          # S'il existe déjà, on ajoute seulement la ligne de signature.

          if "signingConfig signingConfigs.release" not in s:

              build_types = s.find("buildTypes {")

              if build_types == -1:
                  raise SystemExit(
                      "ERREUR : buildTypes { introuvable."
                  )

              release = s.find("release {", build_types)

              if release == -1:
                  raise SystemExit(
                      "ERREUR : release { introuvable dans buildTypes."
                  )

              position = release + len("release {")

              s = (
                  s[:position]
                  + "\n        signingConfig signingConfigs.release"
                  + s[position:]
              )

          p.write_text(s)
          PY

          echo "=== Signature configurée ==="
          grep -n \
            "signingConfigs\|signingConfig\|storeFile\|storePassword\|keyAlias\|keyPassword" \
            android/app/build.gradle || true

      - name: Vérifier la configuration finale Gradle
        run: |
          set -e

          echo "=== Début build.gradle ==="
          sed -n '1,120p' android/app/build.gradle

          echo "=== Test Gradle ==="
          cd android
          chmod +x gradlew

          ./gradlew tasks --no-daemon

      - name: Build APK Release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleRelease

      - name: Vérifier APK
        run: |
          set -e

          echo "=== APK générés ==="

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -ls

          APK=$(find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK Release trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
