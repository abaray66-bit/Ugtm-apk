name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trouver et extraire le projet
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -n "$ZIP" ]; then
            echo "Archive trouvée : $ZIP"
            mkdir -p app
            unzip -o "$ZIP" -d app
            TARGET_DIR="app"
          else
            PKG_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)

            if [ -z "$PKG_PATH" ]; then
              TARGET_DIR="."
            else
              TARGET_DIR=$(dirname "$PKG_PATH")
            fi
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "Projet : $TARGET_DIR"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Vérifier la configuration Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          if [ -f capacitor.config.json ]; then
            echo "Configuration existante :"
            cat capacitor.config.json
          else
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "ma.ugtm.souss.massa",
            "appName": "UGTM Souss-Massa",
            "webDir": "www"
          }
          EOF
          fi

      - name: Générer Android
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Ajouter google-services.json
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          mkdir -p android/app

          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "313270677240",
              "project_id": "ugtm-fns-souss-massa",
              "storage_bucket": "ugtm-fns-souss-massa.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:313270677240:android:1946a591ebb17c33dd150d",
                  "android_client_info": {
                    "package_name": "ma.ugtm.souss.massa"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "313270677240-qj5nkj8cgm22cl9kkh0fnckeerfdh7sj.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyChPWsxsg9rAEFbv3Rr9v4eyjUEmPf8Nos"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "313270677240-qj5nkj8cgm22cl9kkh0fnckeerfdh7sj.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          echo "google-services.json installé."

      - name: Configurer Google Services
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text()

          if "com.google.gms:google-services" not in text:
              text = (
                  "buildscript {\n"
                  "    dependencies {\n"
                  "        classpath 'com.google.gms:google-services:4.4.2'\n"
                  "    }\n"
                  "}\n\n"
                  + text
              )
              root.write_text(text)

          app = Path("android/app/build.gradle")
          text = app.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\n\napply plugin: 'com.google.gms.google-services'\n"

          app.write_text(text)
          PY

      - name: Synchroniser Capacitor
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          npx cap sync android

      - name: Créer le debug keystore et afficher SHA
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew

          KEYSTORE="$HOME/.config/.android/debug.keystore"

          echo "=========================================="
          echo "CREATION DU DEBUG KEYSTORE"
          echo "=========================================="

          mkdir -p "$HOME/.config/.android"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo ""
          echo "=========================================="
          echo "SHA-1 DU CERTIFICAT ANDROID"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey | grep -E "SHA1:|SHA-1:"

          echo ""
          echo "=========================================="
          echo "SHA-256 DU CERTIFICAT ANDROID"
          echo "=========================================="

          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey | grep -E "SHA256:|SHA-256:"

          echo ""
          echo "=========================================="
          echo "SIGNING REPORT"
          echo "=========================================="

          ./gradlew signingReport --console=plain || true

      - name: Compiler APK
        working-directory: ${{ env.TARGET_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Vérifier APK
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: UGTM-Android-APK
          path: ${{ env.TARGET_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

