name: Generer keystore fixe (une seule fois)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generer le keystore fixe
        run: |
          set -e
          KEYSTORE="$HOME/ugtm-debug.keystore"
          rm -f "$KEYSTORE"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo ""
          echo "========== COPIER CECI DANS FIREBASE (SHA-1) =========="
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep "SHA1:"
          echo "======================================================="

      - name: Exporter en base64
        run: |
          base64 -w 0 "$HOME/ugtm-debug.keystore" > keystore.b64

      - name: Fichier a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64
