name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire le zip si présent
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Archive trouvée : $ZIP"
            mkdir -p app
            unzip -o "$ZIP" -d app
            echo "TARGET_DIR=app" >> "$GITHUB_ENV"
          else
            echo "TARGET_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ugtm-fns-souss-massa
          channelId: live
          entryPoint: ${{ env.TARGET_DIR }}
