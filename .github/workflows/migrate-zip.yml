name: Migrate UGTM ZIP to source tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract UGTM ZIP
        run: |
          set -e

          ZIP="ugtm-github-apk-ready-google-fixed-v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : fichier ZIP introuvable : $ZIP"
            exit 1
          fi

          rm -rf /tmp/ugtm-extract
          rm -rf /tmp/ugtm-source

          mkdir -p /tmp/ugtm-extract
          mkdir -p /tmp/ugtm-source

          echo "Extraction de $ZIP..."
          unzip -q "$ZIP" -d /tmp/ugtm-extract

          echo "Recherche du dossier du projet..."

          if [ -f "/tmp/ugtm-extract/package.json" ]; then
            SRC="/tmp/ugtm-extract"
          else
            SRC=$(find /tmp/ugtm-extract \
              -mindepth 1 \
              -maxdepth 4 \
              -type f \
              -name "package.json" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$SRC" ] || [ ! -f "$SRC/package.json" ]; then
            echo "ERREUR : package.json introuvable dans le ZIP."
            echo "Contenu extrait :"
            find /tmp/ugtm-extract -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projet trouvé dans : $SRC"

          cp -a "$SRC"/. /tmp/ugtm-source/

          echo ""
          echo "Fichiers du projet :"
          find /tmp/ugtm-source -maxdepth 2 -type f | sort | head -200

      - name: Copy source to repository root
        run: |
          set -e

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='ios/' \
            --exclude='node_modules/' \
            /tmp/ugtm-source/ ./

          echo ""
          echo "Migration terminée."
          echo ""
          echo "Racine du dépôt :"
          ls -la

      - name: Verify project
        run: |
          set -e

          echo "Vérification..."

          if [ ! -f "package.json" ]; then
            echo "ERREUR : package.json absent."
            exit 1
          fi

          echo "✓ package.json trouvé"

          if [ -d "www" ]; then
            echo "✓ dossier www trouvé"
          else
            echo "⚠ dossier www non trouvé"
          fi

          if [ -f "capacitor.config.json" ]; then
            echo "✓ capacitor.config.json trouvé"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Migrate UGTM app from ZIP to source tree"
          git push
