name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check FIREBASE_TOKEN secret
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "::error::Le secret FIREBASE_TOKEN n'est pas configuré dans ce dépôt GitHub."
            echo "::error::Procédure : firebase login:ci localement, puis copier le token dans Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Run Firestore rules tests (subadmin local)
        run: firebase emulators:exec --only firestore "node test-firestore-subadmin-local.mjs"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Run Firestore rules tests (member privileges, pre-existing)
        run: firebase emulators:exec --only firestore "node test-firestore-member-privileges.mjs" || true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project ugtm-fns-souss-massa --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
